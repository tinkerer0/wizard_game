<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>불마법사 전직 트리</title>
    <style>
      :root {
        font-family: Arial, "Malgun Gothic", sans-serif;
        color: #111;
        background: #f5f5f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
        background: #f5f5f1;
      }

      .sheet {
        position: relative;
        width: 1680px;
        height: 1760px;
        margin: 0 auto;
        border: 1px solid #d7d7ce;
        background: #fffefa;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
      }

      .title {
        position: absolute;
        top: 34px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .root-label {
        position: absolute;
        left: 62px;
        top: 858px;
        font-size: 30px;
        font-weight: 800;
        white-space: nowrap;
      }

      .box {
        position: absolute;
        display: grid;
        place-items: center;
        border: 4px solid #111;
        background: #fffefa;
        color: #111;
        font-weight: 800;
        text-align: center;
        line-height: 1.25;
      }

      .tier1 {
        width: 180px;
        height: 86px;
        padding: 8px;
        font-size: 20px;
      }

      .tier2 {
        width: 160px;
        height: 48px;
        font-size: 15px;
      }

      .tier3 {
        width: 132px;
        height: 28px;
        border-width: 3px;
        font-size: 12px;
      }

      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      path {
        fill: none;
        stroke: #111;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media print {
        body {
          padding: 0;
        }

        .sheet {
          box-shadow: none;
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="sheet" aria-label="불마법사 전직 트리">
      <svg id="connectors" viewBox="0 0 1680 1760" aria-hidden="true"></svg>

      <div class="root-label">불마법사</div>
      <div class="title" style="left: 430px;">1차불마법사 전직</div>
      <div class="title" style="left: 790px;">2차불마법사 전직</div>
      <div class="title" style="left: 1190px;">3차불마법사 전직</div>
    </main>

    <script>
      const sheet = document.querySelector(".sheet");
      const svg = document.getElementById("connectors");

      const root = { x: 210, y: 880 };
      const columns = {
        tier1: { x: 430, w: 180, h: 86 },
        tier2: { x: 800, w: 160, h: 48 },
        tier3: { x: 1210, w: 132, h: 28 },
      };

      const jobs = [
        {
          name: "불꽃검사",
          note: "가까이 붙어서 싸움",
          y: 250,
          tier2: ["화염검무사", "용암중갑검사", "폭열돌격자"],
          tier3: [
            ["홍련검무사", "불꽃난무자", "초열쌍검사"],
            ["용암수호자", "흑요석기사", "분화철갑사"],
            ["폭염돌파자", "화산파쇄자", "폭주검화사"],
          ],
        },
        {
          name: "화포술사",
          note: "멀리서 한 방 쏨",
          y: 810,
          tier2: ["폭염포격수", "관통화포수", "지연폭파술사"],
          tier3: [
            ["대폭염포술사", "작열곡사수", "지옥포격관"],
            ["관통저격수", "열선포술사", "열공저격수"],
            ["시한폭염술사", "지뢰연금술사", "연쇄기폭사"],
          ],
        },
        {
          name: "불씨조율사",
          note: "주변 불씨를 굴리며 싸움",
          y: 1370,
          tier2: ["불씨환술사", "불꽃사역자", "점화조율사"],
          tier3: [
            ["태양환술사", "유성환술사", "쌍환조율사"],
            ["화령소환사", "불새사역자", "분신화술사"],
            ["대연소술사", "화염역병사", "재폭발술사"],
          ],
        },
      ];

      function addBox(tier, x, y, label) {
        const spec = columns[tier];
        const el = document.createElement("div");
        el.className = `box ${tier}`;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.innerHTML = label;
        sheet.appendChild(el);
        return {
          x,
          y,
          w: spec.w,
          h: spec.h,
          cx: x + spec.w / 2,
          cy: y + spec.h / 2,
        };
      }

      function connect(from, to) {
        const startX = from.x + from.w;
        const startY = from.cy;
        const endX = to.x;
        const endY = to.cy;
        const midX = startX + (endX - startX) * 0.45;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
        svg.appendChild(path);
      }

      function connectRoot(to) {
        const midX = root.x + (to.x - root.x) * 0.45;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${root.x} ${root.y} C ${midX} ${root.y}, ${midX} ${to.cy}, ${to.x} ${to.cy}`);
        svg.appendChild(path);
      }

      jobs.forEach((job, jobIndex) => {
        const tier1 = addBox(
          "tier1",
          columns.tier1.x,
          job.y,
          `${job.name}<br><span style="font-size:13px;font-weight:700;">${job.note}</span>`
        );
        connectRoot(tier1);

        const tier2Ys = [job.y - 120, job.y + 20, job.y + 160];
        tier2Ys.forEach((tier2Y, tier2Index) => {
          const tier2 = addBox("tier2", columns.tier2.x, tier2Y, job.tier2[tier2Index]);
          connect(tier1, tier2);

          const tier3Ys = [tier2Y - 42, tier2Y + 8, tier2Y + 58];
          tier3Ys.forEach((tier3Y, tier3Index) => {
            const tier3 = addBox("tier3", columns.tier3.x, tier3Y, job.tier3[tier2Index][tier3Index]);
            connect(tier2, tier3);
          });
        });
      });
    </script>
  </body>
</html>
