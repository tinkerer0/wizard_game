    height: auto;
    aspect-ratio: 960 / 600;

  #hint { margin-top: 14px; font-size: 12px; letter-spacing: 3px; color: #6f6685; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">방향키 이동 &nbsp;·&nbsp; 가까운 적 자동 공격 &nbsp;·&nbsp; B 자동플레이 &nbsp;·&nbsp; R 재시작</div>
</div>

<script>
"use strict";

// ===== 상수 =====
const W = 960, H = 600;
const WALL = 24;                 // 방 벽 두께
const MIN = WALL, MAXX = W - WALL, MAXY = H - WALL;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ===== 헬퍼 =====
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function rand(a, b) { return a + Math.random() * (b - a); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = amt / 100;
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.round(clamp(r + (f<0?r:255-r)*f, 0, 255));
  g = Math.round(clamp(g + (f<0?g:255-g)*f, 0, 255));
  b = Math.round(clamp(b + (f<0?b:255-b)*f, 0, 255));
  return `rgb(${r},${g},${b})`;
}

  line: "rgba(255,255,255,0.07)",
};

// ===== 분위기용 불씨 (메뉴/게임오버 배경) =====
let animClock = 0;
const embers = [];
for (let i = 0; i < 46; i++) embers.push({
  x: Math.random() * W, y: Math.random() * H,
  r: rand(0.6, 2.4), spd: rand(8, 26), drift: rand(-8, 8),
  a: rand(0.15, 0.5), tw: rand(0, Math.PI * 2),
});
function updateEmbers(dt) {
  for (const e of embers) {
    e.y -= e.spd * dt; e.x += e.drift * dt; e.tw += dt;
    if (e.y < -6) { e.y = H + 6; e.x = Math.random() * W; }
  }
}
function drawEmbers(alpha) {
  ctx.fillStyle = "#ff8a45";
  for (const e of embers) {
    const tw = 0.6 + 0.4 * Math.sin(animClock * 2 + e.tw);
    ctx.globalAlpha = e.a * tw * (alpha == null ? 1 : alpha);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const TIER1_CHOICES = ["swordsman", "cannon", "ember"];
let botJobChoice = 0, botJobChoice2 = 0;   // 봇/시뮬이 고를 1차/2차 인덱스
function botPickJob() { applyJobChoice(state.player.tier === 0 ? botJobChoice : botJobChoice2); }
function applyJob(id) { const j = JOBS[id]; if (!j) return; j.apply(state.player); state.player.job = id; state.player.tier = j.tier; }
function getPreviewJob() { return new URLSearchParams(location.search).get("previewJob"); }
function getJobPath(id) {
  if (!JOBS[id]) return [];
  for (const key of Object.keys(JOBS)) {
    if ((JOBS[key].children || []).includes(id)) return getJobPath(key).concat(id);
  }
  return [id];
}
function applyJobPath(id) {
  for (const jobId of getJobPath(id)) applyJob(jobId);
}

// ===== 입력 =====
const keys = new Set();
let mouse = { x: 0, y: 0, clicked: false };

window.addEventListener("keydown", (e) => {
  // 게임용 키는 스크롤 방지
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  handleMetaKeys(e.code);
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener("mousedown", () => { mouse.clicked = true; });

// 메뉴/카드/시작/게임오버 같은 모드 전환 키 처리
function handleMetaKeys(code) {
  if (code === "KeyB") { botEnabled = !botEnabled; if (!botEnabled) clearBotKeys(); return; }
  if (state.mode === "start") {
    const n = CHARACTERS.length;
    if (code === "ArrowLeft" || code === "KeyA") selectedChar = (selectedChar - 1 + n) % n;
    else if (code === "ArrowRight" || code === "KeyD") selectedChar = (selectedChar + 1) % n;
    else if (code === "Digit1") selectedChar = 0;
    else if (code === "Digit2" && n > 1) selectedChar = 1;
    else if (code === "Digit3" && n > 2) selectedChar = 2;
    else if (code === "Digit4" && n > 3) selectedChar = 3;
    else if ((code === "Enter" || code === "Space") && !CHARACTERS[selectedChar].locked) startGame();
    return;
  }
  if (state.mode === "jobselect") {
    if (code === "Digit1") applyJobChoice(0);
    else if (code === "Digit2") applyJobChoice(1);
    else if (code === "Digit3") applyJobChoice(2);
    return;
  }
  if (state.mode === "gameover") { if (code === "KeyR") resetGame(); return; }
}

// ===== 게임 상태 =====
let state;
function resetGame() {
  state = {
    mode: "start",            // start | playing | levelup | intermission | gameover
    time: 0,
    wave: 0,
    kills: 0,
    player: makePlayer(),
    enemies: [],
    bullets: [],
    gems: [],
    particles: [],
    slashes: [],              // 근접 베기 이펙트
    orbits: [],               // 회전 불씨 위치(렌더용, 매 프레임 재계산)
    hazards: [],              // 바닥 불 장판 (지연폭파술사)
    rings: [],                // 폭발 충격파 링 (단계2+)
    sparks: [],               // 화상 전염 불꽃 아크
    afterimages: [],          // 홍련검무사: 남아서 지속 피해 주는 화염 잔상
    aim: { x: 1, y: 0 },      // 마지막 조준 방향
    fireTimer: 0,
    spawnQueue: 0,
    spawnTimer: 0,
    intermissionTimer: 0,
    levelToast: 0,
    jobChoices: [],           // 전직 선택지(jobselect 모드)
  };
}

function makePlayer() {
  return {
    x: W / 2, y: H / 2, r: 14,
    maxHp: 100, hp: 100,
    speed: 200,               // px/s
    level: 1, xp: 0, xpToNext: 6,
    damage: 12,
    fireCooldown: 0.55,       // 발사 간격(초)
    bulletSpeed: 460,
    bulletR: 7,
    attackRange: 210,         // 이 거리 안에 적이 있을 때만 공격 (근거리 전직은 짧게)
    pierce: 0,
    projectiles: 1,           // 동시 발사 수(부채꼴)
    pickupRadius: 70,
    invuln: 0,
    color: "#ff7b2e",         // startGame에서 선택 캐릭터 색으로 설정
    // 전직 관련
    weapon: "fireball",       // fireball | slash | cannon | orbit
    job: null, tier: 0, accent: null,
    explodeRadius: 0,
    bulletShape: null,        // 탄환 모양: shell | lance | bomb (없으면 기본/혜성)
    orbitAngle: 0, orbitCount: 0, orbitRadius: 0, orbitSpeed: 0, orbStyle: null,
    // 2차 시그니처 기믹
    slashStyle: null,         // 베기 모양: single | flurry | heavy | cross
    aura: null,               // {r, dpsFactor} 용암중갑검사
    slashExplode: 0,          // 폭열돌격자: 베기 시 폭발 반경
    groundFire: null,         // {r, life, dpsFactor} 지연폭파술사
    orbShoot: null, orbShootTimer: 0,  // 불꽃사역자: 불씨 자동발사
    burnOnHit: null,          // {dpsFactor, dur} 점화조율사
    burnSpread: 0,            // 화상 전염 반경 (점화조율사)
    crimsonWave: null,         // 홍련검무사: 베기 끝에 퍼지는 전방 화염 파동
  };
}
resetGame();

// 미래 봇/시뮬레이션 훅용 글로벌 노출
window.state = null;
window.keys = keys;

function startGame() {
  const c = CHARACTERS[selectedChar];
  state.character = c.id;
  state.player.color = c.color;
  const previewJob = getPreviewJob();
  if (previewJob && JOBS[previewJob]) {
    state.player.level = 18;
    state.player.xpToNext = 999;
    applyJobPath(previewJob);
  }
  state.mode = "playing";
  startWave(1);
}

// ===== 웨이브 =====
function startWave(n) {
  state.wave = n;
  state.spawnQueue = 4 + Math.round(n * 1.6);
  state.spawnTimer = 0;
  state.mode = "playing";
}

function spawnEnemy() {
  // 방 가장자리(벽 안쪽) 랜덤 위치, 플레이어와 너무 가깝지 않게
  let x, y, tries = 0;
  do {
    const edge = Math.floor(Math.random() * 4);
    if (edge === 0) { x = rand(MIN, MAXX); y = MIN + 8; }
    else if (edge === 1) { x = rand(MIN, MAXX); y = MAXY - 8; }
    else if (edge === 2) { x = MIN + 8; y = rand(MIN, MAXY); }
    else { x = MAXX - 8; y = rand(MIN, MAXY); }
    tries++;
  } while (dist(x, y, state.player.x, state.player.y) < 160 && tries < 12);

  const wave = state.wave;
  const hp = 18 + wave * 6;
  state.enemies.push({
    x, y, r: 13,
    hp, maxHp: hp,
    speed: 55 + wave * 3,
    dmg: 8 + Math.floor(wave / 4) * 2,
    hitFlash: 0,
  });
}

// ===== 발사 =====
function fire() {
  const p = state.player;
  const baseAng = Math.atan2(state.aim.y, state.aim.x);
  const n = p.projectiles;
  const spread = 0.18;          // 라디안
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * spread;
    const a = baseAng + off;
    state.bullets.push({
      x: p.x, y: p.y,
      vx: Math.cos(a) * p.bulletSpeed,
      vy: Math.sin(a) * p.bulletSpeed,
      r: p.bulletR,
      dmg: p.damage,
      pierce: p.pierce,
      life: 1.6,
    });
  }
}

// 무기별 공격 분기
function doAttack(dt) {
  const p = state.player;
  if (p.weapon === "orbit") { updateOrbit(dt); return; }
  let nearest = null, nd = Infinity;
  for (const e of state.enemies) { const d = dist(e.x, e.y, p.x, p.y); if (d < nd) { nd = d; nearest = e; } }
  state.fireTimer -= dt;
  if (!nearest || nd > p.attackRange) { if (state.fireTimer < 0) state.fireTimer = 0; return; }
  const a = Math.atan2(nearest.y - p.y, nearest.x - p.x);
  state.aim.x = Math.cos(a); state.aim.y = Math.sin(a);
  if (state.fireTimer > 0) return;
  state.fireTimer = p.fireCooldown;
  if (p.weapon === "slash") doSlash(a, nearest);
  else if (p.weapon === "cannon") fireCannon(a);
  else fire();
}

// 불꽃검사: 근접 화염 베기 (전방 아크 즉발 피해)
function doSlash(ang, target) {
  const p = state.player;
  const st = p.slashStyle;
  const heavy = st === "heavy";
  const twin = st === "twinSlash";                                      // 초열쌍검사: 전후 동시 베기
  const life = st === "crimson" ? 0.38 : (heavy ? 0.34 : (twin ? 0.26 : 0.2));          // 3차 홍련/묵직: 베기 잔상 길게
  state.slashes.push({ x: p.x, y: p.y, ang, life, max: life, range: p.attackRange, style: st || "single" });
  const half = st === "crimson" ? Math.PI * 0.52 : (heavy ? Math.PI * 0.3 : (st === "thrust" ? Math.PI * 0.22 : (twin ? Math.PI * 0.46 : Math.PI * 0.42)));   // 홍련: 넓은 전방
  for (const e of state.enemies) {
    if (e.hp <= 0) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
    if (d > p.attackRange + e.r) continue;
    let da = Math.abs(Math.atan2(dy, dx) - ang); if (da > Math.PI) da = 2 * Math.PI - da;
    const hit = twin ? (da <= half || (Math.PI - da) <= half) : (da <= half);   // 쌍검: 전방 + 후방 양쪽 모두 타격
    if (hit) {
      e.hp -= p.damage; e.hitFlash = heavy ? 0.18 : 0.1;
      spawnParticles(e.x, e.y, "#ffb347", heavy ? 9 : 5);
      if (heavy) { const k = 52; e.x += (dx / d) * k; e.y += (dy / d) * k; }   // 묵직: 강한 넉백
      if (e.hp <= 0) killEnemy(e);
    }
  }
  // 홍련검무사: 베기 자리에 화염 잔상을 남겨 뒤따라오는 적을 계속 태움 (시그니처)
  if (p.crimsonWave) {
    const w = p.crimsonWave;
    state.afterimages.push({ x: p.x, y: p.y, ang, range: p.attackRange + w.rangeBonus * 0.5, half: Math.PI * 0.5, life: 0.6, max: 0.6, dps: p.damage * 1.4 });
    spawnParticles(p.x + Math.cos(ang) * p.attackRange * 0.55, p.y + Math.sin(ang) * p.attackRange * 0.55, "#ff4040", 14);
  }
  // 폭열돌격자: 맞은 몬스터 뒤쪽에서 폭발 (돌파 후 후방 폭발)
  if (p.slashExplode) {
    let ex, ey;
    if (target) {   // 타겟 뒤쪽(플레이어 반대편)
      ex = target.x + Math.cos(ang) * (target.r + p.slashExplode * 0.55);
      ey = target.y + Math.sin(ang) * (target.r + p.slashExplode * 0.55);
    } else {
      ex = p.x + Math.cos(ang) * p.attackRange; ey = p.y + Math.sin(ang) * p.attackRange;
    }
    for (const e of state.enemies) { if (e.hp > 0 && dist(ex, ey, e.x, e.y) <= p.slashExplode + e.r) { e.hp -= p.damage * 1.4; e.hitFlash = 0.12; if (e.hp <= 0) killEnemy(e); } }
    spawnBurst(ex, ey, ang, p.slashExplode);
  }
  state.enemies = state.enemies.filter((e) => e.hp > 0);
}

// 화포술사: 대형 느린 폭발탄
function fireCannon(ang) {
  const p = state.player;
  state.bullets.push({
    x: p.x, y: p.y, vx: Math.cos(ang) * p.bulletSpeed, vy: Math.sin(ang) * p.bulletSpeed,
    r: p.bulletR, dmg: p.damage, pierce: p.pierce, life: 2.2, explode: p.explodeRadius, big: true, ground: p.groundFire, shape: p.bulletShape,
  });
}

// 불씨조율사: 주변 회전 불씨 접촉 피해(연속 DPS)
function updateOrbit(dt) {
  const p = state.player;
  p.orbitAngle += dt * p.orbitSpeed;
  const n = p.orbitCount, R = p.orbitRadius, dps = p.damage / p.fireCooldown;
  state.orbits = [];
  for (let i = 0; i < n; i++) {
    const a = p.orbitAngle + i * (Math.PI * 2 / n);
    state.orbits.push({ x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R });
  }
  const hurt = function (e, mult) {
    e.hp -= dps * dt * mult; e.hitFlash = 0.08;
    if (p.burnOnHit) { e.burnDps = p.damage * p.burnOnHit.dpsFactor; e.burnTime = p.burnOnHit.dur; }  // 점화조율사
    if (Math.random() < dt * 8) spawnParticles(e.x, e.y, "#ffb347", 1);
    if (e.hp <= 0) killEnemy(e);
  };
  if (["ring", "solar", "meteorRing", "dualRing"].includes(p.orbStyle)) {  // 불 고리: 보이는 띠 전체가 데미지 (이펙트=데미지)
    const hw = p.orbStyle === "solar" ? 28 : (p.orbStyle === "dualRing" ? 12 : 14);
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      const d = dist(p.x, p.y, e.x, e.y);
      if (Math.abs(d - R) <= hw + e.r) hurt(e, 0.85);
      else if (p.orbStyle === "dualRing" && Math.abs(d - R * 0.68) <= hw + e.r) hurt(e, 0.85);  // 쌍환: 안쪽 고리
    }
  } else {                                      // 개별 불씨: 보이는 크기와 동일
    const hitR = p.orbStyle === "blaze" ? 18 : (p.orbStyle === "ember" ? 14 : 16);
    const cmult = p.burnOnHit ? 0.4 : 1;   // 점화조율사는 접촉딜 약하게(화상이 본체)
    for (const o of state.orbits) for (const e of state.enemies) { if (e.hp <= 0) continue; if (dist(o.x, o.y, e.x, e.y) < hitR + e.r) hurt(e, cmult); }
  }
  // 불꽃사역자: 불씨가 가장 가까운 적에게 자동 발사
  if (p.orbShoot) {
    p.orbShootTimer -= dt;
    if (p.orbShootTimer <= 0 && state.enemies.length) {
      p.orbShootTimer = p.orbShoot.interval;
      let tg = null, td = Infinity;
      for (const e of state.enemies) { const d = dist(p.x, p.y, e.x, e.y); if (d < td) { td = d; tg = e; } }
      if (tg) {
        const o = state.orbits[0] || { x: p.x, y: p.y };
        const a = Math.atan2(tg.y - o.y, tg.x - o.x);
        const os = p.orbShoot;
        const spd = os.speed || 440;
        state.bullets.push({ x: o.x, y: o.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: os.r || 6, dmg: p.damage * os.dmgFactor, pierce: 0, life: os.life || 1.4, shape: os.shape });
      }
    }
  }
  state.enemies = state.enemies.filter((e) => e.hp > 0);
}

function spawnExplosion(x, y, r) {
  const tier = state.player.tier || 1, col = state.player.color || "#ff7b2e";
  // 부풀어 오르는 화염구 블룸 (한 방 임팩트)
  state.rings.push({ x, y, r0: r * 0.25, r1: r * 1.02, life: 0.34, max: 0.34, col: "#ff5a24", fill: true, a0: 0.8 });
  // 이중 충격파 (두꺼운 불 + 얇은 흰 코어)
  state.rings.push({ x, y, r0: r * 0.2, r1: r, life: 0.44, max: 0.44, col: "#ff7b2e", width: 7 });
  state.rings.push({ x, y, r0: r * 0.32, r1: r * 1.16, life: 0.3, max: 0.3, col: "#fff0bd", width: 3 });
  // 불티 폭발 (증량 + 불색)
  const n = 22 + tier * 10;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(70, r * 4.2);
    state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.26, 0.52), color: i % 3 === 0 ? "#fff4d0" : (i % 2 ? "#ff7b2e" : "#ff2410"), r: rand(2, 5 + tier) });
  }
}

// 전방 방향 폭발 이펙트 (콘 + 전방 호 충격파) — 폭열돌격자
function spawnBurst(x, y, ang, r) {
  const tier = state.player.tier || 1, col = state.player.color || "#ff7b2e";
  const cx = x + Math.cos(ang) * r * 0.4, cy = y + Math.sin(ang) * r * 0.4;
  // 전방 화염구 블룸
  state.rings.push({ x: cx, y: cy, r0: r * 0.2, r1: r * 0.95, life: 0.3, max: 0.3, col: "#ff5a24", fill: true, a0: 0.7 });
  const n = 20 + tier * 9;
  for (let i = 0; i < n; i++) {
    const a = ang + rand(-0.85, 0.85), s = rand(70, r * 3.8);
    state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.22, 0.46), color: i % 3 === 0 ? "#fff4d0" : (i % 2 ? "#ff7b2e" : "#ff2410"), r: rand(2, 5 + tier) });
  }
  state.rings.push({ x, y, r0: r * 0.25, r1: r, life: 0.36, max: 0.36, col: "#ffca62", ang: ang, spread: 1.15, width: 5 });
}

function spawnSpark(x1, y1, x2, y2, col) {
  state.sparks.push({ x1, y1, x2, y2, life: 0.22, max: 0.22, col });
}

function spawnHazard(x, y, gf) {
  state.hazards.push({ x, y, r: gf.r, life: gf.life, max: gf.life, dps: state.player.damage * gf.dpsFactor });
}

// 2차 지속 피해: 용암 오라 / 바닥 불 장판 / 화상 DoT
function applyDots(dt) {
  const p = state.player;
  if (p.aura) {
    const dps = p.damage * p.aura.dpsFactor;
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      if (dist(p.x, p.y, e.x, e.y) <= p.aura.r + e.r) { e.hp -= dps * dt; e.hitFlash = 0.06; if (e.hp <= 0) killEnemy(e); }
    }
  }
  for (const h of state.hazards) {
    h.life -= dt;
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      if (dist(h.x, h.y, e.x, e.y) <= h.r + e.r) { e.hp -= h.dps * dt; e.hitFlash = 0.06; if (e.hp <= 0) killEnemy(e); }
    }
  }
  state.hazards = state.hazards.filter((h) => h.life > 0);
  for (const e of state.enemies) {
    if (e.hp <= 0 || !e.burnTime || e.burnTime <= 0) continue;
    e.burnTime -= dt; e.hp -= e.burnDps * dt;
    // 화상 전염: 불붙은 적이 주변 적에게 옮김 (점화조율사)
    if (p.burnSpread && Math.random() < dt * 2.5) {
      for (const e2 of state.enemies) {
        if (e2 === e || e2.hp <= 0 || e2.burnTime > 0) continue;
        if (dist(e.x, e.y, e2.x, e2.y) < p.burnSpread) {
          e2.burnDps = e.burnDps; e2.burnTime = (p.burnOnHit && p.burnOnHit.dur) || 2;
          spawnSpark(e.x, e.y, e2.x, e2.y, "#ffb347");      // 불 튀는 아크
          spawnParticles(e2.x, e2.y, "#ffd27a", 5);          // 점화 팝
          break;
        }
      }
    }
    if (Math.random() < dt * 6) spawnParticles(e.x, e.y, "#ff7b2e", 1);
    if (e.hp <= 0) killEnemy(e);
  }
  // 홍련검무사: 화염 잔상 지속 피해
  for (const ai of state.afterimages) {
    ai.life -= dt;
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      const dx = e.x - ai.x, dy = e.y - ai.y, d = Math.hypot(dx, dy) || 1;
      if (d > ai.range + e.r) continue;
      let da = Math.abs(Math.atan2(dy, dx) - ai.ang); if (da > Math.PI) da = 2 * Math.PI - da;
      if (da <= ai.half) { e.hp -= ai.dps * dt; e.hitFlash = 0.07; if (e.hp <= 0) killEnemy(e); }
    }
  }
  state.afterimages = state.afterimages.filter((ai) => ai.life > 0);
  state.enemies = state.enemies.filter((e) => e.hp > 0);
}

// ===== 자동 플레이 봇 (테스트용) =====
let botEnabled = false;
const botMom = { x: 0, y: 0 };
const BOT_MOVE = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD"];
function clearBotKeys() { for (const k of BOT_MOVE) keys.delete(k); }
function botControl() {
  const p = state.player, enemies = state.enemies, gems = state.gems;
  clearBotKeys();
  // 적도 젬도 없으면 그냥 가만히 (드리프트 안 함)
  if (enemies.length === 0 && gems.length === 0) { botMom.x = 0; botMom.y = 0; return; }
  const emergency = p.hp / p.maxHp <= 0.4;
  const melee = (p.weapon === "slash" || p.weapon === "orbit");
  // 무기별 교전 거리 (오브는 회전 반경 근처에서 싸워야 불씨가 닿음)
  const engage = p.weapon === "orbit" ? (p.orbitRadius || 90) : p.weapon === "slash" ? 70 : p.weapon === "cannon" ? 165 : 150;

  // 적 반발력 + 가장 가까운 적
  let ex = 0, ey = 0, nearD = Infinity, nearest = null;
  for (const e of enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (d < nearD) { nearD = d; nearest = e; }
    if (d < engage) { const s = Math.pow((engage - d) / engage, 1.2) * (emergency ? 2.6 : 1); ex += dx / d * s; ey += dy / d * s; }
  }
  // 벽 회피력
  let wx = 0, wy = 0; const wR = 95;
  if (p.x < MIN + wR) wx += (MIN + wR - p.x) / wR;
  if (p.x > MAXX - wR) wx -= (p.x - (MAXX - wR)) / wR;
  if (p.y < MIN + wR) wy += (MIN + wR - p.y) / wR;
  if (p.y > MAXY - wR) wy -= (p.y - (MAXY - wR)) / wR;

  // 안전 판정 (근접/오브는 적이 있으면 교전, 멀리 떨어져 있어도 다가감)
  let safe;
  if (enemies.length === 0) safe = true;
  else if (melee) safe = false;
  else safe = !emergency && Math.hypot(ex, ey) < 0.25 && nearD > 150;

  let fx, fy;
  if (safe && gems.length) {
    // 안전할 때: 가장 가까운 경험치 돌로 이동
    let g = null, gd = Infinity;
    for (const z of gems) { const d = dist(z.x, z.y, p.x, p.y); if (d < gd) { gd = d; g = z; } }
    const dx = g.x - p.x, dy = g.y - p.y, m = Math.hypot(dx, dy) || 1;
    fx = dx / m + wx; fy = dy / m + wy;
  } else if (melee && !emergency && nearest && nearD > engage) {
    // 근접/오브: 사정거리까지 적에게 접근
    const dx = nearest.x - p.x, dy = nearest.y - p.y, m = Math.hypot(dx, dy) || 1;
    fx = dx / m + wx; fy = dy / m + wy;
  } else {
    fx = ex + wx; fy = ey + wy;
  }

  const mag = Math.hypot(fx, fy);
  if (mag < 0.15) {
    if (botMom.x || botMom.y) { fx = botMom.x; fy = botMom.y; }
    else { fx = W / 2 - p.x; fy = H / 2 - p.y; const m = Math.hypot(fx, fy) || 1; fx /= m; fy /= m; }
  } else { botMom.x = fx / mag; botMom.y = fy / mag; }
  const dz = 0.12;
  if (fx > dz) keys.add("ArrowRight"); else if (fx < -dz) keys.add("ArrowLeft");
  if (fy > dz) keys.add("ArrowDown"); else if (fy < -dz) keys.add("ArrowUp");
  // 공격은 자동 조준이라 봇은 이동만 담당 (사정거리 안에 적이 있으면 알아서 발사됨)
}

// ===== 업데이트 =====
function update(dt, now) {
  state.time += dt;
  if (state.levelToast > 0) state.levelToast -= dt;
  const p = state.player;
  if (botEnabled) botControl();

  // --- 이동 (방향키, WASD도 허용) ---
  let mx = 0, my = 0;
  if (keys.has("ArrowLeft") || keys.has("KeyA")) mx -= 1;
  if (keys.has("ArrowRight") || keys.has("KeyD")) mx += 1;
  if (keys.has("ArrowUp") || keys.has("KeyW")) my -= 1;
  if (keys.has("ArrowDown") || keys.has("KeyS")) my += 1;
  if (mx !== 0 || my !== 0) {
    const m = Math.hypot(mx, my);
    p.x += (mx / m) * p.speed * dt;
    p.y += (my / m) * p.speed * dt;
  }
  p.x = clamp(p.x, MIN + p.r, MAXX - p.r);
  p.y = clamp(p.y, MIN + p.r, MAXY - p.r);

  // --- 공격 (무기별 자동 조준) ---
  doAttack(dt);

  // --- 탄환 ---
  for (const b of state.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.x < MIN || b.x > MAXX || b.y < MIN || b.y > MAXY) b.life = 0;
  }

  // --- 적 스폰 ---
  if (state.spawnQueue > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      state.spawnQueue--;
      state.spawnTimer = 0.35;
    }
  }

  // --- 적 이동 + 접촉 ---
  if (p.invuln > 0) p.invuln -= dt;
  for (const e of state.enemies) {
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d) * e.speed * dt;
    e.y += (dy / d) * e.speed * dt;
    if (d < e.r + p.r && p.invuln <= 0) {
      p.hp -= e.dmg;
      p.invuln = 0.7;
      spawnParticles(p.x, p.y, "#ff5a5a", 8);
      if (p.hp <= 0) { p.hp = 0; gameOver(); return; }
    }
  }

  // --- 지속 피해 (오라/장판/화상) ---
  applyDots(dt);

  // --- 탄환 vs 적 ---
  for (const b of state.bullets) {
    if (b.life <= 0) continue;
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      if (dist(b.x, b.y, e.x, e.y) < b.r + e.r) {
        if (b.explode) {
          // 폭발: 반경 내 모든 적에게 피해
          for (const e2 of state.enemies) {
            if (e2.hp <= 0) continue;
            if (dist(b.x, b.y, e2.x, e2.y) <= b.explode) {
              e2.hp -= b.dmg; e2.hitFlash = 0.1;
              if (e2.hp <= 0) killEnemy(e2);
            }
          }
          spawnExplosion(b.x, b.y, b.explode);
          if (b.ground) spawnHazard(b.x, b.y, b.ground);
          b.life = 0;
        } else {
          e.hp -= b.dmg;
          e.hitFlash = 0.1;
          spawnParticles(b.x, b.y, "#ffb347", 4);
          if (b.pierce > 0) { b.pierce--; } else { b.life = 0; }
          if (e.hp <= 0) killEnemy(e);
        }
        if (b.life <= 0) break;
      }
    }
  }

  // --- 죽은 적/탄환 제거 ---
  state.enemies = state.enemies.filter((e) => e.hp > 0);
  state.bullets = state.bullets.filter((b) => b.life > 0);

  // --- 젬 수집 ---
  for (const g of state.gems) {
    const d = dist(g.x, g.y, p.x, p.y);
    if (d < p.pickupRadius) {
      // 끌어당김
      const dx = p.x - g.x, dy = p.y - g.y, m = Math.hypot(dx, dy) || 1;
      g.x += (dx / m) * 320 * dt;
      g.y += (dy / m) * 320 * dt;
    }
    if (d < p.r + 6) { g.dead = true; gainXp(g.value); }
  }
  state.gems = state.gems.filter((g) => !g.dead);

  // --- 파티클 ---
  for (const pt of state.particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.9; pt.vy *= 0.9;
    pt.life -= dt;
  }
  state.particles = state.particles.filter((pt) => pt.life > 0);

  // --- 베기 이펙트 / 충격파 링 수명 ---
  for (const s of state.slashes) s.life -= dt;
  state.slashes = state.slashes.filter((s) => s.life > 0);
  for (const rg of state.rings) rg.life -= dt;
  state.rings = state.rings.filter((rg) => rg.life > 0);
  for (const sp of state.sparks) sp.life -= dt;
  state.sparks = state.sparks.filter((sp) => sp.life > 0);

  // --- 웨이브 종료 체크 ---
  if (state.mode === "playing" && state.spawnQueue === 0 && state.enemies.length === 0) {
    state.mode = "intermission";
    state.intermissionTimer = 2.0;
  }
  if (state.mode === "intermission") {
    state.intermissionTimer -= dt;
    if (state.intermissionTimer <= 0) startWave(state.wave + 1);
  }
}

function killEnemy(e) {
  state.kills++;
  for (let i = 0; i < 13; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(50, 190);
    state.particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), color: i % 2 ? "#ffd27a" : "#ff6a3a", r: rand(2, 4.5) });
  }
  state.rings.push({ x: e.x, y: e.y, r0: e.r * 0.5, r1: e.r * 2.8, life: 0.28, max: 0.28, col: "#ff9a5a" });   // 처치 팝
  state.gems.push({ x: e.x, y: e.y, value: 5, dead: false });
}

function gainXp(v) {
  const p = state.player;
  p.xp += v;
  while (p.xp >= p.xpToNext) {
    p.xp -= p.xpToNext;
    p.level++;
    p.xpToNext = Math.round(6 + p.level * 4 + Math.pow(p.level, 1.8) * 1.2);
    applyLevelStats(p);            // 전직 외 레벨업 = 정해진 스탯 자동 상승 (선택 없음)
    state.levelToast = 1.4;
    if (p.level >= 4 && p.tier === 0) openJobSelect();        // 1차 전직 (Lv4)
    else if (p.level >= 10 && p.tier === 1) openJobSelect();  // 2차 전직 (Lv10)
    else if (p.level >= 18 && p.tier === 2) openJobSelect();  // 3차 전직 (Lv18)
  }
}

// 레벨업마다 자동으로 오르는 고정 스탯
function applyLevelStats(p) {
  p.maxHp += 8; p.hp += 8;         // 회복도 같이
  p.damage += 2;
  // 공격 속도는 레벨업으로 자동 상승하지 않음 (업그레이드/전직으로만)
}

// 전직 선택 열기 (게임 일시정지) / 적용
function openJobSelect() {
  const p = state.player;
  state.jobChoices = (p.tier === 0) ? TIER1_CHOICES.slice() : ((JOBS[p.job] && JOBS[p.job].children) || []).slice();
  if (state.jobChoices.length) state.mode = "jobselect";
}
function applyJobChoice(idx) {
  if (!state.jobChoices.length) return;
  const id = state.jobChoices[clamp(idx, 0, state.jobChoices.length - 1)];
  applyJob(id);   // applyJob이 job/tier도 설정
  state.jobChoices = [];
  state.mode = "playing";
}

function gameOver() {
  state.mode = "gameover";
}

// ===== 파티클 =====
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(40, 160);
    state.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.2, 0.5), color, r: rand(2, 4),
    });
  }
}

// ===== 렌더 =====
function drawVignette(strength) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.86);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawMenuBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#140e20"); g.addColorStop(1, "#080610");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, H * 0.4, 30, W / 2, H * 0.4, 540);
  rg.addColorStop(0, "rgba(255,120,50,0.12)"); rg.addColorStop(1, "rgba(255,120,50,0)");
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  drawEmbers();
  drawVignette(0.5);
}

function drawArena() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 640);
  g.addColorStop(0, "#231a31"); g.addColorStop(1, "#130e1d");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 타일 그리드
  ctx.strokeStyle = "rgba(255,255,255,0.035)"; ctx.lineWidth = 1;
  for (let x = MIN; x <= MAXX; x += 48) { ctx.beginPath(); ctx.moveTo(x, MIN); ctx.lineTo(x, MAXY); ctx.stroke(); }
  for (let y = MIN; y <= MAXY; y += 48) { ctx.beginPath(); ctx.moveTo(MIN, y); ctx.lineTo(MAXX, y); ctx.stroke(); }
  // 벽 (어두운 두꺼운 테두리)
  ctx.lineWidth = WALL; ctx.strokeStyle = "#0e0a16";
  ctx.strokeRect(WALL / 2, WALL / 2, W - WALL, H - WALL);
  // 안쪽 골드 라인
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(232,179,90,0.22)";
  ctx.strokeRect(WALL + 1, WALL + 1, W - WALL * 2 - 2, H - WALL * 2 - 2);
  drawVignette(0.35);
}

function render() {
  if (state.mode === "start") { drawMenuBg(); drawStart(); return; }

  drawArena();
  const p = state.player, col = p.color || "#ff7b2e", tier = p.tier || 1;

  // 바닥 불 장판 (작열곡사수/지연폭파 계열) — 일렁이며 타오르는 불바닥
  for (const h of state.hazards) {
    const a = clamp(h.life / h.max, 0, 1);
    ctx.save();
    // 달궈진 바닥
    const hg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    hg.addColorStop(0, hexA("#ff7b2e", 0.42 * a)); hg.addColorStop(0.55, hexA("#ff3a16", 0.28 * a)); hg.addColorStop(1, hexA("#7a0306", 0));
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
    // 바닥에서 피어오르는 불꽃 (위로 솟는 글리프)
    ctx.globalCompositeOperation = "lighter";
    const fn = Math.max(7, Math.round(h.r / 11));
    for (let i = 0; i < fn; i++) {
      const ang = (i * 2.3994), rr = h.r * (0.18 + 0.72 * ((i * 0.37) % 1));
      const fx = h.x + Math.cos(ang) * rr, fy = h.y + Math.sin(ang) * rr;
      const fl = 0.55 + 0.45 * Math.sin(animClock * 9 + i * 1.7);
      ctx.save(); ctx.translate(fx, fy);
      ctx.globalAlpha = a * 0.5 * fl;
      drawFlameGlyph(h.r * 0.11 * fl, i % 2 ? "#ffca62" : "#ff3a16");
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 젬
  ctx.save();
  ctx.shadowColor = "#49e0ff"; ctx.shadowBlur = 10; ctx.fillStyle = "#8eecff";
  for (const g of state.gems) {
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - 6); ctx.lineTo(g.x + 6, g.y);
    ctx.lineTo(g.x, g.y + 6); ctx.lineTo(g.x - 6, g.y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 파티클
  for (const pt of state.particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 폭발 충격파 링 / 화염구 블룸
  for (const rg of state.rings) {
    const k = 1 - rg.life / rg.max, cr = rg.r0 + (rg.r1 - rg.r0) * k, al = rg.life / rg.max;
    if (rg.fill) {                       // 부풀어 오르는 화염구 블룸
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = al * (rg.a0 || 0.7);
      const g = ctx.createRadialGradient(rg.x, rg.y, 0, rg.x, rg.y, cr);
      g.addColorStop(0, hexA("#fff4d0", 0.95)); g.addColorStop(0.42, hexA(rg.col, 0.6)); g.addColorStop(1, hexA(rg.col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(rg.x, rg.y, cr, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = al * 0.7;
      ctx.strokeStyle = rg.col; ctx.lineWidth = rg.width || 3;
      ctx.beginPath();
      if (rg.ang !== undefined) ctx.arc(rg.x, rg.y, cr, rg.ang - rg.spread, rg.ang + rg.spread);
      else ctx.arc(rg.x, rg.y, cr, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // 화상 전염 — 일렁이는 불꽃 줄기 (점화조율사)
  for (const sp of state.sparks) {
    const a = sp.life / sp.max;
    const dx = sp.x2 - sp.x1, dy = sp.y2 - sp.y1, len = Math.hypot(dx, dy) || 1;
    const ox = -dy / len, oy = dx / len, N = 7;
    ctx.save(); ctx.globalAlpha = a;
    for (let i = 0; i <= N; i++) {
      const k = i / N;
      const wave = Math.sin(k * Math.PI * 3 + animClock * 22 + sp.x1) * len * 0.07;
      const x = sp.x1 + dx * k + ox * wave, y = sp.y1 + dy * k + oy * wave;
      const sz = (4 + 5 * Math.sin(k * Math.PI)) * (0.75 + 0.5 * Math.random());
      const g = ctx.createRadialGradient(x, y, 0, x, y, sz);
      g.addColorStop(0, "#fff3c0"); g.addColorStop(0.5, "#ff9b2e"); g.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 적
  for (const e of state.enemies) {
    const g = ctx.createRadialGradient(e.x - 3, e.y - 3, 2, e.x, e.y, e.r);
    if (e.hitFlash > 0) { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#ff9485"); }
    else { g.addColorStop(0, "#e35a4b"); g.addColorStop(1, "#871d15"); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    if (e.hp < e.maxHp) {
      const w = e.r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.55)"; rr(e.x - e.r, e.y - e.r - 8, w, 4, 2); ctx.fill();
      ctx.fillStyle = "#6ee06e"; rr(e.x - e.r, e.y - e.r - 8, w * (e.hp / e.maxHp), 4, 2); ctx.fill();
    }
  }

  // 탄환 (단계↑ 꼬리 트레일)
  for (const b of state.bullets) {
    if (tier >= 2) {
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, segs = tier >= 3 ? 5 : 3;
      for (let k = 1; k <= segs; k++) {

        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(b.x - ux * k * 7, b.y - uy * k * 7, b.r * (1.5 - k * 0.18), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (b.shape === "sniper") {     // 관통저격: 강렬하고 묵직한 관통탄 (코어 구슬)
      const ba = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff2410"; ctx.shadowBlur = 24;
      const len = b.r * 7.5;
      const grd = ctx.createLinearGradient(-len, 0, len, 0);
      grd.addColorStop(0, hexA("#ff2410", 0)); grd.addColorStop(0.25, "#ffca62"); grd.addColorStop(0.65, "#fff7d5"); grd.addColorStop(1, hexA("#ff5a24", 0));
      ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(0, 0, len, b.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
      // 코어 구슬 (더 밝게)
      ctx.fillStyle = "#fff4d0"; ctx.globalAlpha = 0.98; ctx.beginPath(); ctx.arc(len * 0.52, 0, b.r * 1.0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffca62"; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(len * 0.55, 0, b.r * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.shape === "thermal") {     // 열공저격: 굵고 명확한 초장거리 열탄
      const ba = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff2410"; ctx.shadowBlur = 28;
      const len = b.r * 14;
      const grd = ctx.createLinearGradient(-len, 0, len, 0);
      grd.addColorStop(0, hexA("#ff2410", 0)); grd.addColorStop(0.2, "#ffca62"); grd.addColorStop(0.5, "#fff7d5"); grd.addColorStop(0.8, "#ff5a24"); grd.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(0, 0, len, b.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hexA("#fff4d0", 0.8); ctx.beginPath(); ctx.ellipse(0, 0, len * 0.6, b.r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.shape === "ray") {     // 열선포술사: 연속 발사 열선 빔
      const ba = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      ctx.globalCompositeOperation = "lighter";
      ctx.shadowColor = "#ff2410"; ctx.shadowBlur = 32; ctx.lineCap = "round"; ctx.lineJoin = "round";
      // 외부 가우시안 글로우
      ctx.strokeStyle = hexA("#ff2410", 0.6); ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(-b.r * 8, 0); ctx.lineTo(b.r * 9, 0); ctx.stroke();
      // 중간 레이어
      ctx.strokeStyle = "#ff7b2e"; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(-b.r * 8, 0); ctx.lineTo(b.r * 9, 0); ctx.stroke();
      // 코어 (가장 밝음)
      ctx.strokeStyle = "#fff7d5"; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(-b.r * 7, 0); ctx.lineTo(b.r * 9, 0); ctx.stroke();
      // 초코어 (주황 점멸)
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(animClock * 8);
      ctx.strokeStyle = "#ffca62"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-b.r * 7, 0); ctx.lineTo(b.r * 9, 0); ctx.stroke();
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (b.shape === "megaShell") {       // 대폭염: 깔끔하고 밝은 대형 화염구
      const sc = 1.85;
      ctx.save(); ctx.shadowColor = "#ff7b2e"; ctx.shadowBlur = 22;
      const grd = ctx.createRadialGradient(b.x - b.r * 0.5, b.y - b.r * 0.5, b.r * 0.1, b.x, b.y, b.r * sc);
      grd.addColorStop(0, "#fff7d5"); grd.addColorStop(0.4, "#ffb347"); grd.addColorStop(0.72, "#ff2b22"); grd.addColorStop(1, hexA("#5b0606", 0));
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * sc, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff0bd"; ctx.lineWidth = 2; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * sc * 0.55, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    } else if (b.shape === "hellShell") {       // 지옥포격: 흑염 핵 + 지옥불 코로나 (대형 포탄)
      const sc = 2.45;
      ctx.save();
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff2410"; ctx.shadowBlur = 30;
      const corona = ctx.createRadialGradient(b.x, b.y, b.r * 0.4, b.x, b.y, b.r * sc);
      corona.addColorStop(0, hexA("#ff3a16", 0.7)); corona.addColorStop(0.5, hexA("#ff2410", 0.4)); corona.addColorStop(1, hexA("#7a0306", 0));
      ctx.fillStyle = corona; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * sc, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + animClock * 1.5;
        ctx.save(); ctx.translate(b.x + Math.cos(a) * b.r * 1.5, b.y + Math.sin(a) * b.r * 1.5); ctx.rotate(a + Math.PI * 0.5);
        ctx.globalAlpha = 0.7; drawFlameGlyph(b.r * 0.5 * (0.8 + 0.3 * Math.sin(animClock * 10 + i)), i % 2 ? "#ffca62" : "#ff3a16"); ctx.restore();
      }
      ctx.globalCompositeOperation = "source-over";
      const core = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r * 1.15);
      core.addColorStop(0, "#ff7b2e"); core.addColorStop(0.45, "#8f0308"); core.addColorStop(1, "#2b0708");
      ctx.fillStyle = core; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.15, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.shape === "scorcher") {
      // 작열곡사수: 포탄 모양 + 포물선 궤적 장판
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.shadowColor = "#ff7b2e"; ctx.shadowBlur = 22;
      // 포탄 몸체 (둥근 포탄)
      const shellGrad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.15, b.x, b.y, b.r * 1.35);
      shellGrad.addColorStop(0, "#fff4d0"); shellGrad.addColorStop(0.35, "#ff9a3d"); shellGrad.addColorStop(0.7, "#ff4a22"); shellGrad.addColorStop(1, "#8f2f0a");
      ctx.fillStyle = shellGrad; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.35, 0, Math.PI * 2); ctx.fill();
      // 포탄 전면 광 반사
      ctx.fillStyle = "#fff7d5"; ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.6, 0, Math.PI * 2); ctx.fill();
      // 포물선 궤적 흔적 (뒷부분에서 앞쪽으로 약한 자국)
      ctx.globalAlpha = 0.25;
      for (let i = 1; i <= 3; i++) {
        const speed = Math.hypot(b.vx, b.vy) || 100;
        const trailX = b.x - (b.vx / speed) * b.r * 2.5 * i;
        const trailY = b.y - (b.vy / speed) * b.r * 2.5 * i - (i * i * 0.8); // 포물선 아래로 떨어지는 효과
        const trailGrad = ctx.createRadialGradient(trailX, trailY, 0, trailX, trailY, b.r * (1.35 - i * 0.15));
        trailGrad.addColorStop(0, hexA("#ff7b2e", 0.6)); trailGrad.addColorStop(1, hexA("#ff4a22", 0));
        ctx.fillStyle = trailGrad; ctx.beginPath(); ctx.arc(trailX, trailY, b.r * (1.35 - i * 0.15), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else if (b.shape === "infernoBomb") {     // 시한폭염: 크게 맥동하는 시한폭탄
      const puls = 0.8 + 0.2 * Math.sin(animClock * 10);
      ctx.save();
      ctx.fillStyle = shade(col, -52); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.35, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff4a22"; ctx.shadowBlur = 24 * puls;
      const cg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6 * puls);
      cg.addColorStop(0, hexA("#fff4d0", 0.95)); cg.addColorStop(0.5, hexA("#ff5a24", 0.6)); cg.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.6 * puls, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 3; i++) { ctx.save(); ctx.translate(b.x + (i - 1) * b.r * 0.62, b.y - b.r * 1.2); ctx.globalAlpha = 0.85; drawFlameGlyph(b.r * 0.7 * (0.8 + 0.3 * Math.sin(animClock * 14 + i)), i % 2 ? "#ffca62" : "#ff5a24"); ctx.restore(); }
      ctx.restore();
    } else if (b.shape === "mine") {            // 지뢰: 작은 폭탄 + 깜빡이는 점화 코어
      ctx.save();
      ctx.fillStyle = shade(col, -52); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff4a22"; ctx.shadowBlur = 10;
      const blink = 0.45 + 0.55 * Math.abs(Math.sin(animClock * 9));
      ctx.fillStyle = hexA("#ffca62", blink); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(b.x, b.y - b.r * 0.95); ctx.globalAlpha = 0.8; drawFlameGlyph(b.r * 0.5 * (0.8 + 0.3 * Math.sin(animClock * 16)), "#ff5a24"); ctx.restore();
      ctx.restore();
    } else if (b.shape === "chainBomb") {       // 연쇄기폭: 폭탄 + 주위를 도는 연쇄 불씨
      ctx.save();
      ctx.fillStyle = shade(col, -52); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "lighter"; ctx.shadowColor = "#ff4a22"; ctx.shadowBlur = 14;
      const cg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.15);
      cg.addColorStop(0, hexA("#fff4d0", 0.9)); cg.addColorStop(0.5, hexA("#ff5a24", 0.5)); cg.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.15, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 3; i++) { const a = animClock * 5 + i * Math.PI * 2 / 3; ctx.fillStyle = i % 2 ? "#ffca62" : "#ff3a16"; ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * b.r * 1.85, b.y + Math.sin(a) * b.r * 1.85, b.r * 0.35, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    } else if (["meteor", "spiritBolt", "phoenixBolt", "cloneBolt"].includes(b.shape)) {
      const ba = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      ctx.shadowColor = b.shape === "phoenixBolt" ? "#ffd27a" : col; ctx.shadowBlur = b.shape === "phoenixBolt" ? 26 : 16;
      const len = b.shape === "phoenixBolt" ? b.r * 4.8 : b.r * 3.2;
      const grd = ctx.createLinearGradient(-len, 0, len, 0);
      grd.addColorStop(0, hexA(col, 0)); grd.addColorStop(0.45, col); grd.addColorStop(1, "#fff4d0");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(len, 0); ctx.quadraticCurveTo(0, b.r * 1.4, -len, 0); ctx.quadraticCurveTo(0, -b.r * 1.4, len, 0);
      ctx.fill();
      if (b.shape === "phoenixBolt") {
        ctx.strokeStyle = "#fff0bd"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-b.r, 0); ctx.quadraticCurveTo(-b.r * 3, -b.r * 2.4, -b.r * 5, -b.r * 0.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-b.r, 0); ctx.quadraticCurveTo(-b.r * 3, b.r * 2.4, -b.r * 5, b.r * 0.3); ctx.stroke();
      }
      ctx.restore();
    } else if (b.shape === "lance") {
      // 관통화포수: 가늘고 긴 랜스
      const ba = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      const grd = ctx.createLinearGradient(-b.r * 4, 0, b.r * 5, 0);
      grd.addColorStop(0, hexA(col, 0)); grd.addColorStop(0.5, col); grd.addColorStop(1, "#fff4d0");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.ellipse(0, 0, b.r * 5, b.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.shape === "shell") {
      // 폭염포격수: 큼직한 포탄
      const grd = ctx.createRadialGradient(b.x - b.r * 0.4, b.y - b.r * 0.4, b.r * 0.2, b.x, b.y, b.r * 1.5);
      grd.addColorStop(0, "#fff4d0"); grd.addColorStop(0.5, col); grd.addColorStop(1, shade(col, -30));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2); ctx.fill();
    } else if (b.shape === "bomb") {
      // 지연폭파술사: 폭탄 (어두운 코어 + 불씨)
      ctx.fillStyle = shade(col, -45);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff4d0";
      ctx.beginPath(); ctx.arc(b.x + Math.cos(animClock * 20) * b.r, b.y - b.r * 1.4, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (tier >= 2) {
      // 기본 혜성
      const ba = Math.atan2(b.vy, b.vx), len = b.r * (2.6 + tier * 0.7), wid = b.r * 1.7;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ba);
      const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
      grd.addColorStop(0, "#fff4d0"); grd.addColorStop(0.4, col); grd.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.ellipse(0, 0, len, wid, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
