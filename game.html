      grd.addColorStop(0, "#fff4d0"); grd.addColorStop(0.45, col); grd.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 용암 오라 (용암중갑검사 계열) — 직업별 색/느낌: 수호자=밝은 주황 / 흑요석=어두운 흑적 / 분화=맥동
  if (p.aura) {
    const ar = p.aura.r, st = p.slashStyle;
    const dark = st === "obsidian";                                   // 흑요석: 어두운 열기
    const pulse = st === "eruption" ? (1 + 0.06 * Math.sin(animClock * 6)) : 1;   // 분화: 맥동
    const edgeCol = dark ? "#8f1810" : "#ff5a24";
    const glyphA = dark ? "#ff3a16" : "#ffca62", glyphB = dark ? "#7a0306" : "#ff3a16";
    ctx.save();
    const ag = ctx.createRadialGradient(p.x, p.y, ar * 0.2, p.x, p.y, ar * pulse);
    if (dark) { ag.addColorStop(0, hexA("#7a0306", 0.16)); ag.addColorStop(0.6, hexA("#8f0308", 0.2)); ag.addColorStop(0.9, hexA("#5b0606", 0.44)); ag.addColorStop(1, hexA("#1a0406", 0.06)); }
    else { ag.addColorStop(0, hexA("#ff7b2e", 0.22)); ag.addColorStop(0.6, hexA("#ff3a16", 0.18)); ag.addColorStop(0.9, hexA("#e0201a", 0.36)); ag.addColorStop(1, hexA("#7a0306", 0.04)); }
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(p.x, p.y, ar * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    // 일렁이는 가장자리 (분화는 더 크게 출렁)
    const wobAmp = st === "eruption" ? 0.09 : 0.055;
    const seg = 30;
    ctx.beginPath();
    for (let i = 0; i <= seg; i++) {
      const a = i / seg * Math.PI * 2;
      const wob = 1 + wobAmp * Math.sin(a * 5 + animClock * 4) + 0.035 * Math.sin(a * 9 - animClock * 6);
      const x = p.x + Math.cos(a) * ar * pulse * wob, y = p.y + Math.sin(a) * ar * pulse * wob;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.strokeStyle = hexA(edgeCol, dark ? 0.7 : 0.55); ctx.lineWidth = 3; ctx.shadowColor = edgeCol; ctx.shadowBlur = 10; ctx.stroke();
    // 가장자리에서 피어오르는 불꽃 글리프
    const fn = st === "eruption" ? 14 : 11;
    for (let i = 0; i < fn; i++) {
      const a = i / fn * Math.PI * 2 + animClock * 0.3;
      const fl = 0.7 + 0.3 * Math.sin(animClock * 7 + i);
      ctx.save();
      ctx.translate(p.x + Math.cos(a) * ar * pulse, p.y + Math.sin(a) * ar * pulse);
      ctx.rotate(a - Math.PI * 0.5);
      ctx.globalAlpha = (dark ? 0.42 : 0.5) * fl;
      drawFlameGlyph(ar * (st === "eruption" ? 0.085 : 0.07) * fl, i % 2 ? glyphA : glyphB);
      ctx.restore();
    }
    ctx.restore();
  }

  // 플레이어 (메뉴 캐릭터 선택의 마법사 모습과 동일 + 전직 엠블럼)
  if (!(p.invuln > 0 && Math.floor(state.time * 20) % 2 === 0)) {
    const halo = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r + 14);
    halo.addColorStop(0, hexA(col, 0.5)); halo.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 14, 0, Math.PI * 2); ctx.fill();
    drawWizard(p.x, p.y, col, 0.82, p.tier);
    if (p.accent) drawEmblem(p.x, p.y - p.r - 26, p.accent, col);
  }

  // 회전 불씨 — 직업별 모양
  if (state.orbits.length) drawOrbits(p, col);
  // 홍련검무사 화염 잔상 (베기 뒤에 남아 타오름)
  for (const ai of state.afterimages) {
    const a = clamp(ai.life / ai.max, 0, 1);
    ctx.save(); ctx.translate(ai.x, ai.y);
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a * 0.55;
    drawFlameArcBlade(ai.ang, 0.8, 0.1, ai.half * 0.85, "#ff2430", ai.range * 0.9, a, 1);
    ctx.globalAlpha = a * 0.3;
    drawFlameTongues(ai.ang, ai.range * 0.85, a);
    ctx.restore(); ctx.globalCompositeOperation = "source-over";
  }
  // 베기 이펙트 — 직업마다 모양이 다름 (single/flurry/heavy/cross)
  for (const s of state.slashes) {
    const t = clamp(s.life / s.max, 0, 1), R = s.range, st = s.style || "single";
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.globalAlpha = t;
    ctx.shadowColor = hexA(col, 0.9); ctx.shadowBlur = 8 + tier * 6;
    if (st === "crimsonFlurry") {     // 홍련검무사: 2차 3연 베기 틀 + 홍련 검압 장식
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      // 타오르는 부채꼴 화염 베이스: 베기 전체에 붉게 타오르는 열기를 깔아 "불타는 덩어리" 느낌을 강조.
      ctx.globalAlpha = t * 0.42;
      const cwHalo = ctx.createRadialGradient(Math.cos(s.ang) * R * 0.5, Math.sin(s.ang) * R * 0.5, R * 0.1, Math.cos(s.ang) * R * 0.5, Math.sin(s.ang) * R * 0.5, R * 0.98);
      cwHalo.addColorStop(0, "#ff7b2e"); cwHalo.addColorStop(0.5, hexA("#ff2a14", 0.55)); cwHalo.addColorStop(1, hexA("#8f0308", 0));
      ctx.fillStyle = cwHalo;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.18, s.ang - 1.08, s.ang + 1.08); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      drawFlameArcBlade(s.ang - 0.05, 0.46, 0.09, 0.82, "#ff2410", R * 0.93, t, 0);
      drawFlameBladeTrim(s.ang - 0.05, 0.46, 0.82, "#ff6a1e", R * 0.93, t, 0);
      drawFlameArcBlade(s.ang + 0.02, 0.74, 0.11, 0.94, "#ff7b2e", R * 1.02, t, 1);
      drawFlameBladeTrim(s.ang + 0.02, 0.74, 0.94, "#ffca62", R * 1.02, t, 1);
      drawFlameArcBlade(s.ang + 0.08, 1.04, 0.09, 0.82, "#ff2410", R * 1.12, t, 2);
      // 칼날을 타고 핥는 화염 혀 — 불 느낌의 핵심 (트윈과 동일 처리)
      drawFlameTongues(s.ang, R * 1.08, t);
      ctx.globalCompositeOperation = "lighter";
      // 흩날리는 동그란 불티 (트윈과 동일 — 다이아/선 대신 부드러운 불꽃 입자)
      for (let i = 0; i < 16; i++) {
        const a = s.ang + rand(-1.05, 1.05), rr = R * rand(0.45, 1.18);
        ctx.globalAlpha = t * rand(0.35, 0.9);
        ctx.fillStyle = i % 3 === 0 ? "#ffe39a" : (i % 2 ? "#ff6a1e" : "#ff2a14");
        ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, rand(1.4, 3.4), 0, Math.PI * 2); ctx.fill();
      }
      // 칼날 끝에서 솟는 큰 불꽃들.
      for (let i = 0; i < 6; i++) {
        const k = i / 5;
        const a = s.ang - 0.55 + k * 1.1;
        const rr = R * (1.12 + 0.08 * Math.sin(k * Math.PI));
        ctx.save();
        ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr);
        ctx.rotate(a + Math.PI * 0.5);
        ctx.globalAlpha = t * (0.45 + 0.35 * Math.sin(k * Math.PI));
        drawFlameGlyph(R * (0.055 + 0.025 * Math.sin(k * Math.PI)), i % 2 ? "#ffd27a" : "#ff3b24");
        ctx.restore();
      }
      ctx.globalCompositeOperation = "source-over";
    } else if (st === "infernoFlurry") {     // 불꽃난무자: 휘몰아치는 칼날 폭풍
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // 1) 화염 후광 베이스 (홍련/트윈과 동일 톤)
      ctx.globalAlpha = t * 0.4;
      const ifHalo = ctx.createRadialGradient(Math.cos(s.ang) * R * 0.5, Math.sin(s.ang) * R * 0.5, R * 0.1, Math.cos(s.ang) * R * 0.5, Math.sin(s.ang) * R * 0.5, R * 0.95);
      ifHalo.addColorStop(0, "#ff7b2e"); ifHalo.addColorStop(0.5, hexA("#ff2a14", 0.5)); ifHalo.addColorStop(1, hexA("#8f0308", 0));
      ctx.fillStyle = ifHalo;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.1, s.ang - 0.95, s.ang + 0.95); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      // 2) 빠르게 갈아내는 작은 화염참 무리 (다단히트) — 칼날들이 전방 콘에서 빠르게 휙휙 순환
      const nb = 9;
      for (let i = 0; i < nb; i++) {
        const ph = animClock * 6 + i * (Math.PI * 2 / nb);
        const a = s.ang + Math.sin(ph) * 0.78;
        const rMid = 0.42 + 0.5 * (0.5 + 0.5 * Math.cos(ph));
        ctx.globalAlpha = t * (0.35 + 0.5 * Math.abs(Math.cos(ph)));
        drawFlameArcBlade(a, rMid, 0.05, 0.34, i % 2 ? "#ff7b2e" : "#ff2410", R * 0.95, t, i % 3);
      }
      // 3) 화염 혀 + 동그란 불티
      drawFlameTongues(s.ang, R * 1.04, t);
      for (let i = 0; i < 14; i++) {
        const a = s.ang + rand(-0.95, 0.95), r = R * rand(0.4, 1.15);
        ctx.globalAlpha = t * rand(0.4, 0.9);
        ctx.fillStyle = i % 3 === 0 ? "#ffe39a" : (i % 2 ? "#ff6a1e" : "#ff2a14");
        ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, rand(1.3, 3.2), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    } else if (st === "magmaShield") {     // 용암수호자: 묵직한 용암 강타 + 화염
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = t * 0.7; drawFlameTongues(s.ang, R * 1.0, t * 0.8);
      ctx.restore();
      ctx.globalAlpha = t; drawSmash(s.ang, R * 1.06, 0.9, "#ff5a24");
    } else if (st === "obsidian") {         // 흑요석기사: 검은 흑요석 강타 + 속에서 타는 용암 빛
      ctx.globalAlpha = t; drawSmash(s.ang, R * 1.08, 0.9, "#3a1418");
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const bx = Math.cos(s.ang) * R * 0.72, by = Math.sin(s.ang) * R * 0.72;
      ctx.globalAlpha = t * 0.9;
      const og = ctx.createRadialGradient(bx, by, R * 0.05, bx, by, R * 0.44);
      og.addColorStop(0, hexA("#ffe39a", 0.95)); og.addColorStop(0.45, hexA("#ff3a16", 0.55)); og.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = og; ctx.beginPath(); ctx.arc(bx, by, R * 0.44, 0, Math.PI * 2); ctx.fill();
      drawFlameTongues(s.ang, R * 0.92, t * 0.5);
      ctx.restore();
    } else if (st === "eruption") {         // 분화철갑사: 용암 강타 + 사방으로 터지는 분화 불꽃
      ctx.globalAlpha = t; drawSmash(s.ang, R * 1.0, 0.9, "#ff3d20");
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const en = 12;
      for (let i = 0; i < en; i++) {
        const a = i / en * Math.PI * 2;
        const fl = 0.7 + 0.3 * Math.sin(animClock * 8 + i);
        ctx.save();
        ctx.translate(Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82);
        ctx.rotate(a - Math.PI * 0.5);
        ctx.globalAlpha = t * 0.7 * fl;
        drawFlameGlyph(R * 0.085 * fl, i % 2 ? "#ffca62" : "#ff3216");
        ctx.restore();
      }
      drawFlameTongues(s.ang, R * 1.0, t * 0.6);
      ctx.restore();
    } else if (st === "flameBreak") {     // 폭염돌파자: 긴 화염 돌파 창 + 뒤로 끌리는 불길
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      // 돌진 잔염: 플레이어 뒤로 끌리는 불꽃
      for (let i = 0; i < 8; i++) {
        const k = i / 7, back = -k * R * 0.75;
        ctx.save();
        ctx.translate(Math.cos(s.ang) * back, Math.sin(s.ang) * back);
        ctx.rotate(s.ang - Math.PI * 0.5);
        ctx.globalAlpha = t * (0.6 - k * 0.5);
        drawFlameGlyph(R * (0.13 - k * 0.09) * (0.8 + 0.3 * Math.sin(animClock * 10 + i)), i % 2 ? "#ffca62" : "#ff3216");
        ctx.restore();
      }
      ctx.globalAlpha = t * 0.55; drawThrust(s.ang, R * 1.12, "#ffca62");
      ctx.restore();
      ctx.globalAlpha = t; drawThrust(s.ang, R * 1.28, "#ff3a16");
    } else if (st === "volcano") {         // 화산파쇄자: 전방에 거대한 화산 분출 (큰 폭발 반경)
      ctx.globalAlpha = t; drawThrust(s.ang, R * 0.88, "#ff3a16");
      const ex = Math.cos(s.ang) * R * 0.9, ey = Math.sin(s.ang) * R * 0.9, er = R * 0.55;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = t * 0.85;
      const vg = ctx.createRadialGradient(ex, ey, er * 0.1, ex, ey, er);
      vg.addColorStop(0, hexA("#fff3d0", 0.95)); vg.addColorStop(0.42, hexA("#ff5a24", 0.65)); vg.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = vg; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2, fl = 0.7 + 0.3 * Math.sin(animClock * 9 + i);
        ctx.save(); ctx.translate(ex + Math.cos(a) * er * 0.85, ey + Math.sin(a) * er * 0.85);
        ctx.rotate(a - Math.PI * 0.5); ctx.globalAlpha = t * 0.8 * fl;
        drawFlameGlyph(er * 0.16 * fl, i % 2 ? "#ffca62" : "#ff3216"); ctx.restore();
      }
      ctx.restore();
    } else if (st === "berserk") {          // 폭주검화사: 빠르게 마구 찌르는 화염 연속 찌르기 (폭주)
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (let i = -2; i <= 2; i++) {
        const a = s.ang + i * 0.16 + Math.sin(animClock * 16 + i) * 0.05;
        ctx.globalAlpha = t * (0.5 + 0.4 * Math.abs(Math.cos(animClock * 14 + i)));
        drawThrust(a, R * (1.0 + 0.12 * Math.abs(i)), i % 2 ? "#ffca62" : "#ff2410");
      }
      drawFlameTongues(s.ang, R * 1.0, t * 0.55);
      for (let i = 0; i < 12; i++) {
        const a = s.ang + rand(-0.7, 0.7), r = R * rand(0.5, 1.2);
        ctx.globalAlpha = t * rand(0.4, 0.9); ctx.fillStyle = i % 2 ? "#ffe39a" : "#ff3216";
        ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, rand(1.3, 3), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else if (st === "flurry") {     // 화염검무사: 얇은 베기 3겹 (난도질)
      drawBlade(s.ang, 0.60, 0.13, 1.25, col, R);
      drawBlade(s.ang, 0.79, 0.15, 1.18, col, R);
      drawBlade(s.ang, 0.98, 0.13, 1.06, col, R);
    } else if (st === "heavy") {      // 용암중갑검사: 묵직한 용암 스매시(둔중한 쐐기 덩어리)
      const f = 1 + (1 - t) * 0.16;
      drawSmash(s.ang, R * f, 0.9, col);
    } else if (st === "thrust") {     // 폭열돌격자: 좁은 전방 돌파
      drawThrust(s.ang, R, col);
    } else if (st === "twinSlash") {  // 초열쌍검사: 전후 양방향 동시 쌍검 화염참 (포위 대응)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // 전방(s.ang)·후방(s.ang+PI) 두 방향에 동시에 쌍검(X자) 화염참을 뿌린다.
      for (let d = 0; d < 2; d++) {
        const dir = s.ang + d * Math.PI;
        const lead = d === 0;                      // 전방을 살짝 더 밝고 크게
        const rr = R * (lead ? 1.0 : 0.92);
        // 1) 베기 자리에 깔리는 붉은 불길 후광 (불 컨셉 베이스)
        ctx.globalAlpha = t * (lead ? 0.3 : 0.22);
        const halo = ctx.createRadialGradient(Math.cos(dir) * rr * 0.5, Math.sin(dir) * rr * 0.5, rr * 0.1, Math.cos(dir) * rr * 0.5, Math.sin(dir) * rr * 0.5, rr * 0.85);
        halo.addColorStop(0, "#ff7b2e"); halo.addColorStop(0.55, hexA("#ff2a14", 0.5)); halo.addColorStop(1, hexA("#8f0308", 0));
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(0, 0, rr * 1.05, dir - 1.0, dir + 1.0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
        // 2) 두 칼날이 X로 교차하며 베는 화염 칼날 (불 그라데이션 내장)
        drawFlameArcBlade(dir - 0.30, 0.50, 0.11, 0.64, "#ff2410", rr, t, 0);
        drawFlameArcBlade(dir + 0.30, 0.50, 0.11, 0.64, lead ? "#ff7b2e" : "#ff4a16", rr, t, 2);
        // 3) 칼날을 타고 핥는 화염 혀 — 불 느낌의 핵심
        drawFlameTongues(dir, rr * 1.02, t);
        // 4) 칼끝에서 솟구치는 큰 불꽃
        for (let i = 0; i < 7; i++) {
          const k = i / 6, a = dir - 0.7 + k * 1.4;
          const fr = rr * (1.0 + 0.1 * Math.sin(k * Math.PI));
          ctx.save();
          ctx.translate(Math.cos(a) * fr, Math.sin(a) * fr);
          ctx.rotate(a + Math.PI * 0.5);
          ctx.globalAlpha = t * (0.5 + 0.35 * Math.sin(k * Math.PI));
          drawFlameGlyph(rr * (0.05 + 0.03 * Math.sin(k * Math.PI)) * (0.85 + 0.3 * Math.sin(animClock * 11 + i)), i % 2 ? "#ffca62" : "#ff3216");
          ctx.restore();
        }
        // 5) 흩날리는 불티 (불색 위주)
        for (let i = 0; i < 10; i++) {
          const a = dir + rand(-0.95, 0.95), r = rr * rand(0.4, 1.12);
          ctx.globalAlpha = t * rand(0.4, 0.9);
          ctx.fillStyle = i % 3 === 0 ? "#ffe39a" : (i % 2 ? "#ff6a1e" : "#ff2a14");
          ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, rand(1.4, 3.2), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    } else if (st === "cross") {      // X자 교차 (예비)
      drawBlade(s.ang - 0.5, 0.84, 0.30, 1.0, col, R);
      drawBlade(s.ang + 0.5, 0.84, 0.30, 1.0, col, R);
    } else {                          // 단일 반달 (불꽃검사 1차)
      drawBlade(s.ang, 0.8, 0.44, 1.2, col, R);
    }
    ctx.restore();
  }

  drawHUD();
  if (botEnabled) drawAutoBadge();
  if (state.levelToast > 0) drawLevelToast();

  if (state.mode === "intermission") drawIntermission();
  if (state.mode === "jobselect") drawJobSelect();
  if (state.mode === "gameover") drawGameOver();
}

function drawLevelToast() {
  const a = clamp(state.levelToast, 0, 1);
  const rise = (1 - clamp(state.levelToast / 1.4, 0, 1)) * 10;
  ctx.save();
  ctx.globalAlpha = a; ctx.textAlign = "center";
  ctx.shadowColor = "rgba(120,210,255,0.6)"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#8fe6ff"; ctx.font = 'bold 28px "Malgun Gothic"';
  ctx.fillText(`LEVEL UP · Lv ${state.player.level}`, W / 2, 116 - rise);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#cdbfe6"; ctx.font = '14px "Malgun Gothic"';
  ctx.fillText("체력 +8   공격력 +2", W / 2, 140 - rise);
  ctx.restore();
  ctx.textAlign = "left";
}

function drawAutoBadge() {
  ctx.save();
  ctx.fillStyle = "rgba(70,200,120,0.92)";
  rr(W / 2 - 56, 16, 112, 26, 13); ctx.fill();
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(animClock * 4);
  ctx.fillStyle = "#0c160e"; ctx.font = 'bold 13px "Malgun Gothic"';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("● AUTO PLAY", W / 2, 30);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}

function drawHUD() {
  const p = state.player;
  ctx.textBaseline = "alphabetic";

  // 좌상단 패널
  const px = 24, py = 20, pw = 270, ph = 72;
  ctx.fillStyle = "rgba(10,7,16,0.6)"; rr(px, py, pw, ph, 14); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = UI.line; rr(px, py, pw, ph, 14); ctx.stroke();

  // 레벨 뱃지
  const bx = px + 40, by = py + ph / 2;
  const bg = ctx.createLinearGradient(bx, by - 24, bx, by + 24);
  bg.addColorStop(0, "#f3c970"); bg.addColorStop(1, "#cd863a");
  ctx.save(); ctx.shadowColor = "rgba(240,180,90,0.5)"; ctx.shadowBlur = 12;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, 23, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#2a1c0a"; ctx.textAlign = "center";
  ctx.font = '9px "Malgun Gothic"'; ctx.fillText("LV", bx, by - 6);
  ctx.font = 'bold 21px "Malgun Gothic"'; ctx.fillText(p.level, bx, by + 14);

  // 바 영역
  const barX = px + 76, barW = pw - 76 - 18;
  // HP
  const hy = py + 18, hh = 16;
  ctx.fillStyle = "rgba(0,0,0,0.45)"; rr(barX, hy, barW, hh, 8); ctx.fill();
  const hpw = barW * clamp(p.hp / p.maxHp, 0, 1);
  if (hpw > 0) {
    const hg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hg.addColorStop(0, "#ff5d6c"); hg.addColorStop(1, "#ff9a5a");
    ctx.fillStyle = hg; rr(barX, hy, Math.max(hpw, 6), hh, 8); ctx.fill();
  }
  ctx.fillStyle = "#fff"; ctx.font = 'bold 11px "Malgun Gothic"';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, barX + barW / 2, hy + hh / 2 + 1);
  ctx.textBaseline = "alphabetic";

  // XP
  const xy = py + 44, xh = 9;
  ctx.fillStyle = "rgba(0,0,0,0.45)"; rr(barX, xy, barW, xh, 5); ctx.fill();
  const xpw = barW * clamp(p.xp / p.xpToNext, 0, 1);
  if (xpw > 0) {
    const xgd = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    xgd.addColorStop(0, "#46b8ff"); xgd.addColorStop(1, "#7df0ff");
    ctx.fillStyle = xgd; rr(barX, xy, Math.max(xpw, 5), xh, 5); ctx.fill();
  }

  // 현재 전직 이름
  if (p.job && JOBS[p.job]) {
    ctx.textAlign = "left"; ctx.fillStyle = UI.gold; ctx.font = 'bold 15px "Malgun Gothic"';
    ctx.fillText(JOBS[p.job].name, px + 2, py + ph + 18);
  }

  // 우상단: 웨이브 / 처치
  const rw = 188, rh = 60, rx = W - 24 - rw, ry = 20;
  ctx.fillStyle = "rgba(10,7,16,0.6)"; rr(rx, ry, rw, rh, 14); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = UI.line; rr(rx, ry, rw, rh, 14); ctx.stroke();
  ctx.textAlign = "left";
  ctx.fillStyle = UI.muted; ctx.font = '11px "Malgun Gothic"'; ctx.fillText("WAVE", rx + 18, ry + 24);
  ctx.fillStyle = UI.text; ctx.font = 'bold 26px "Malgun Gothic"'; ctx.fillText(state.wave, rx + 18, ry + 48);
  ctx.textAlign = "right";
  ctx.fillStyle = UI.muted; ctx.font = '11px "Malgun Gothic"'; ctx.fillText("처치", rx + rw - 18, ry + 24);
  ctx.fillStyle = UI.text; ctx.font = 'bold 26px "Malgun Gothic"'; ctx.fillText(state.kills, rx + rw - 18, ry + 48);
  ctx.textAlign = "left";
}

// 마법사 그리기 (모자 + 얼굴 + 수염) — 메뉴/인게임 공용, s = 크기 배율
// tier: 모자 화려함 단계 (1=기본, 2=금띠, 3=불꽃끝+글로우)
function drawWizard(cx, cy, color, s, tier) {
  s = s || 1; tier = tier || 1;
  // 얼굴
  ctx.fillStyle = "#cdbfae";
  ctx.beginPath(); ctx.arc(cx, cy + 8 * s, 13 * s, 0, Math.PI * 2); ctx.fill();
  // 수염
  ctx.fillStyle = "#ece4d7";
  ctx.beginPath(); ctx.moveTo(cx - 11 * s, cy + 8 * s); ctx.quadraticCurveTo(cx, cy + 32 * s, cx + 11 * s, cy + 8 * s); ctx.closePath(); ctx.fill();
  // 모자 챙
  ctx.fillStyle = shade(color, -28);
  ctx.beginPath(); ctx.ellipse(cx, cy - 2 * s, 22 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
  // 모자 콘
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(cx + 2 * s, cy - 33 * s); ctx.lineTo(cx - 18 * s, cy - 1 * s); ctx.lineTo(cx + 20 * s, cy - 1 * s); ctx.closePath(); ctx.fill();
  // 모자 보석
  ctx.fillStyle = "#fff3cf";
  ctx.beginPath(); ctx.arc(cx - 2 * s, cy - 13 * s, 2.6 * s, 0, Math.PI * 2); ctx.fill();

  // === 단계별 모자 장식 ===
  if (tier >= 2) {
    // 금색 띠 + 보석 (조금 더 화려)
    ctx.strokeStyle = "#ffd86b"; ctx.lineWidth = 2.4 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx - 15 * s, cy - 4 * s); ctx.lineTo(cx + 17 * s, cy - 4 * s); ctx.stroke();
    ctx.fillStyle = "#ffe9a8";
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(cx + 1 * s + i * 9 * s, cy - 4 * s, 1.8 * s, 0, Math.PI * 2); ctx.fill(); }
  }
  if (tier >= 3) {
    // 보석 글로우 + 끝 불꽃 + 양옆 별 (더 화려)
    ctx.save();
    ctx.shadowColor = "#ffe08a"; ctx.shadowBlur = 9 * s;
    ctx.fillStyle = "#fff6d8";
    ctx.beginPath(); ctx.arc(cx - 2 * s, cy - 13 * s, 3.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd054";
    ctx.beginPath();
    ctx.moveTo(cx + 2 * s, cy - 42 * s);
    ctx.quadraticCurveTo(cx - 6 * s, cy - 34 * s, cx - 3 * s, cy - 30 * s);
    ctx.quadraticCurveTo(cx + 4 * s, cy - 33 * s, cx + 6 * s, cy - 31 * s);
    ctx.quadraticCurveTo(cx + 6 * s, cy - 38 * s, cx + 2 * s, cy - 42 * s);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#ffd86b";
    ctx.beginPath(); ctx.arc(cx - 17 * s, cy - 3 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 18 * s, cy - 3 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
  }
}

// 전직 엠블럼 (머리 위 작은 표식) — 1차는 살짝만
function drawEmblem(cx, cy, kind, color) {
  ctx.save();
  ctx.lineCap = "round";
  if (kind === "slash") {
    ctx.strokeStyle = "#fff3cf"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy + 2, 7, -1.1, 0.5); ctx.stroke();
  } else if (kind === "cannon") {
    ctx.fillStyle = "#2a2336"; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.stroke();
  } else if (kind === "orbit") {
    ctx.strokeStyle = hexA(color, 0.85); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fff3cf"; ctx.beginPath(); ctx.arc(cx + 7, cy, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// 반달(초승달) 경로 — ctx가 중심으로 translate된 상태에서 호출. ang 방향으로 볼록.
function crescentPath(ang, rMid, half, arc) {
  const N = 20, a0 = ang - arc, a1 = ang + arc;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) { const k = i / N, a = a0 + (a1 - a0) * k, w = Math.sin(Math.PI * k), r = rMid + w * half; const px = Math.cos(a) * r, py = Math.sin(a) * r; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  for (let i = N; i >= 0; i--) { const k = i / N, a = a0 + (a1 - a0) * k, w = Math.sin(Math.PI * k), r = rMid - w * half; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}

// 베기 칼날 1개 (ctx가 베기 중심으로 translate된 상태에서 호출)
function drawBlade(ang, rMid, half, arc, col, range) {
  crescentPath(ang, range * rMid, range * half, arc);
  const g = ctx.createRadialGradient(0, 0, range * 0.3, 0, 0, range * 1.2);
  g.addColorStop(0, col); g.addColorStop(0.6, shade(col, 25)); g.addColorStop(1, "#fff3d0");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.strokeStyle = "#fff7e4"; ctx.stroke();
}

function drawFlameArcBlade(ang, rMid, half, arc, col, range, t, seed) {
  const N = 34;
  const a0 = ang - arc;
  const a1 = ang + arc;
  const outer = [];
  const inner = [];
  const flameCenters = [0.18, 0.43, 0.68, 0.86];
  for (let i = 0; i <= N; i++) {
    const k = i / N;
    const a = a0 + (a1 - a0) * k;
    const body = Math.sin(Math.PI * k);
    const r = range * rMid + body * range * half;
    outer.push([Math.cos(a) * r, Math.sin(a) * r, a, r]);
  }
  for (let i = N; i >= 0; i--) {
    const k = i / N;
    const a = a0 + (a1 - a0) * k;
    const body = Math.sin(Math.PI * k);
    const base = range * rMid - body * range * half * 0.50;
    let flameBite = 0;
    for (let c = 0; c < flameCenters.length; c++) {
      const center = flameCenters[c] + (seed - 1) * 0.025 * (c % 2 ? 1 : -1);
      const amp = range * (0.16 + c * 0.022 + seed * 0.008);
      const width = 0.06 + c * 0.012;
      flameBite += amp * Math.exp(-Math.pow((k - center) / width, 2));
    }
    const shoulder = range * 0.05 * Math.sin(Math.PI * k) * Math.sin(Math.PI * k * 2 + seed);
    const angleCurl = (Math.sin(Math.PI * k * 3 + seed * 1.7) * 0.035 - flameBite / range * 0.05) * body;
    const r = base - flameBite + shoulder;
    const aa = a + angleCurl;
    inner.push([Math.cos(aa) * r, Math.sin(aa) * r]);
  }
  ctx.beginPath();
  for (let i = 0; i < outer.length; i++) {
    const p = outer[i];
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  drawSmoothPathThrough(inner, true);
  ctx.closePath();
  const g = ctx.createRadialGradient(0, 0, range * 0.25, 0, 0, range * 1.25);
  g.addColorStop(0, "#fff4c8");
  g.addColorStop(0.38, col);
  g.addColorStop(0.72, "#ff341f");
  g.addColorStop(1, hexA("#8f0308", 0.08));
  ctx.fillStyle = g;
  ctx.fill();

  // 밝은 불꽃 중심선: 혀 모양이 어둡게 묻히지 않게 안쪽에 빛을 한 번 더 깐다.
  ctx.save();
  ctx.globalAlpha = t * 0.34;
  ctx.shadowColor = "#ffd27a";
  ctx.shadowBlur = 10;
  ctx.strokeStyle = "#ffd27a";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let i = 0; i < inner.length; i += 2) {
    const p = inner[i];
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSmoothPathThrough(points, continuePath) {
  if (!points.length) return;
  if (continuePath) ctx.lineTo(points[0][0], points[0][1]);
  else ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length - 1; i++) {
    const p = points[i], n = points[i + 1];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + n[0]) * 0.5, (p[1] + n[1]) * 0.5);
  }
  const last = points[points.length - 1];
  ctx.lineTo(last[0], last[1]);
}

function drawFlameBladeTrim(ang, rMid, arc, col, range, t, seed) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = t * 0.72;
  ctx.shadowColor = col;
  ctx.shadowBlur = seed === 1 ? 18 : 14;
  const count = seed === 1 ? 7 : 5;
  for (let i = 0; i < count; i++) {
    const k = count === 1 ? 0 : i / (count - 1);
    const a = ang - arc * 0.72 + k * arc * 1.44;
    const r = range * (rMid + 0.06 + 0.05 * Math.sin(k * Math.PI));
    const s = range * (seed === 1 ? 0.032 : 0.026) * (0.8 + 0.35 * Math.sin(k * Math.PI));
    ctx.save();
    ctx.translate(Math.cos(a) * r, Math.sin(a) * r);
    ctx.rotate(a + Math.PI * 0.5);
    drawFlameGlyph(s, col);
    ctx.restore();
  }
  ctx.globalAlpha = t * (seed === 1 ? 0.32 : 0.22);
  ctx.strokeStyle = col;
  ctx.lineWidth = seed === 1 ? 5 : 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(0, 0, range * (rMid + 0.08), ang - arc * 0.6, ang + arc * 0.64);
  ctx.stroke();
  ctx.restore();
}

function drawFlameTongues(ang, range, t) {
  ctx.save();
  ctx.globalAlpha = t * 0.86;
  ctx.shadowColor = "#ff4a22";
  ctx.shadowBlur = 18;
  for (let layer = 0; layer < 3; layer++) {
    const baseR = range * (0.58 + layer * 0.2);
    const count = layer === 1 ? 5 : 4;
    for (let i = 0; i < count; i++) {
      const k = count === 1 ? 0 : i / (count - 1);
      const a = ang - 0.72 + k * 1.44 + (layer - 1) * 0.08;
      const flick = 0.75 + 0.25 * Math.sin(animClock * 12 + i * 1.7 + layer);
      const x = Math.cos(a) * baseR;
      const y = Math.sin(a) * baseR;
      const scale = range * (0.08 + layer * 0.012) * flick;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a - Math.PI * 0.48);
      drawFlameGlyph(scale, (i + layer) % 2 ? "#ffca62" : "#ff2a24");
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawFlameGlyph(s, color) {
  const g = ctx.createLinearGradient(0, s, 0, -s * 1.5);
  g.addColorStop(0, shade(color, -35));
  g.addColorStop(0.56, color);
  g.addColorStop(1, "#fff0bd");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -s * 1.55);
  ctx.bezierCurveTo(s * 0.42, -s * 1.08, s * 0.62, -s * 0.62, s * 0.44, -s * 0.1);
  ctx.bezierCurveTo(s * 0.96, -s * 0.4, s * 1.05, s * 0.38, s * 0.38, s * 0.9);
  ctx.bezierCurveTo(s * 0.12, s * 1.1, -s * 0.18, s * 1.1, -s * 0.42, s * 0.86);
  ctx.bezierCurveTo(-s * 1.0, s * 0.26, -s * 0.7, -s * 0.48, -s * 0.16, -s * 0.12);
  ctx.bezierCurveTo(-s * 0.38, -s * 0.78, -s * 0.26, -s * 1.2, 0, -s * 1.55);
  ctx.fill();
}

// 묵직한 용암 철퇴 — 자루 + 둥근 용암 공 + 짧은 스파이크(모닝스타)
function drawSmash(ang, range, halfAng, col) {
  const bx = Math.cos(ang) * range * 0.72, by = Math.sin(ang) * range * 0.72;  // 공 중심
  const rad = range * 0.46;
  // 자루
  ctx.lineCap = "round"; ctx.strokeStyle = "#6e5532"; ctx.lineWidth = range * 0.12;
  ctx.beginPath(); ctx.moveTo(Math.cos(ang) * range * 0.08, Math.sin(ang) * range * 0.08); ctx.lineTo(bx, by); ctx.stroke();
  // 둥근 용암 공
  const g = ctx.createRadialGradient(bx - rad * 0.3, by - rad * 0.3, rad * 0.2, bx, by, rad);
  g.addColorStop(0, "#fff3d0"); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -25));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bx, by, rad, 0, Math.PI * 2); ctx.fill();
}

// 회전 불씨 — 직업별 모양 (ember 동그라미 / ring 불고리 / spirit 정령 / blaze 화염)
function drawOrbits(p, col) {
  const os = p.orbStyle, R = p.orbitRadius;
  if (["ring", "solar", "meteorRing", "dualRing"].includes(os)) {   // 불 고리 (띠 전체가 데미지 범위)
    const hw = os === "solar" ? 28 : (os === "dualRing" ? 12 : 14);
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14;
    // 달아오른 고리 띠 (R ± hw = 실제 데미지 범위)
    ctx.beginPath(); ctx.arc(p.x, p.y, R + hw, 0, Math.PI * 2); ctx.arc(p.x, p.y, R - hw, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(p.x, p.y, R - hw, p.x, p.y, R + hw);
    g.addColorStop(0, hexA("#ff2410", 0.3)); g.addColorStop(0.5, os === "solar" ? "#ff9020" : "#ff5a24"); g.addColorStop(1, hexA("#ff2410", 0.3));
    ctx.fillStyle = g; ctx.fill("evenodd");
    if (os === "dualRing") {                       // 쌍환: 안쪽 고리 띠 (R*0.68 ± hw = 안쪽 데미지 범위)
      const ir = R * 0.68;
      ctx.beginPath(); ctx.arc(p.x, p.y, ir + hw, 0, Math.PI * 2); ctx.arc(p.x, p.y, ir - hw, 0, Math.PI * 2);
      const ig = ctx.createRadialGradient(p.x, p.y, ir - hw, p.x, p.y, ir + hw);
      ig.addColorStop(0, hexA("#ff2410", 0.28)); ig.addColorStop(0.5, "#ff5a24"); ig.addColorStop(1, hexA("#ff2410", 0.28));
      ctx.fillStyle = ig; ctx.fill("evenodd");
    }
    // 고리를 따라 바깥으로 솟는 불꽃
    ctx.globalCompositeOperation = "lighter";
    const drawRingFlames = (rr, fn, spin, sz) => {
      for (let i = 0; i < fn; i++) {
        const a = i / fn * Math.PI * 2 + spin;
        const fl = 0.6 + 0.4 * Math.sin(animClock * 10 + i * 1.3);
        ctx.save(); ctx.translate(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); ctx.rotate(a + Math.PI * 0.5);
        ctx.globalAlpha = 0.7 * fl;
        drawFlameGlyph(sz * fl, i % 2 ? "#ffca62" : "#ff3a16"); ctx.restore();
      }
    };
    drawRingFlames(R, os === "solar" ? 24 : (os === "dualRing" ? 20 : 16), animClock * 0.5, os === "solar" ? hw * 0.7 : hw * 0.6);
    if (os === "dualRing") drawRingFlames(R * 0.68, 14, -animClock * 0.6, hw * 0.55);   // 쌍환: 안쪽 고리
    ctx.restore();
    // 핵심 불씨 (데미지 지점) — 작은 불 blob
    for (const o of state.orbits) {
      const rr = os === "solar" ? 10 : 7;
      const og = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, rr);
      og.addColorStop(0, "#fff4d0"); og.addColorStop(0.5, "#ff7b2e"); og.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = og; ctx.beginPath(); ctx.arc(o.x, o.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }
  for (const o of state.orbits) {
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 10;
    if (["spirit", "fireSpirit", "phoenix", "clone"].includes(os)) {
      const a = Math.atan2(o.y - p.y, o.x - p.x);
      ctx.translate(o.x, o.y); ctx.rotate(a);
      ctx.globalCompositeOperation = "lighter";
      const r = os === "phoenix" ? 24 : (os === "clone" ? 13 : (os === "fireSpirit" ? 18 : 15));
      // 화령: 뒤로 끌리는 불꼬리 (다트하는 불 정령)
      if (os === "fireSpirit") {
        const tl = r * 3.2 * (0.85 + 0.15 * Math.sin(animClock * 14 + o.x));
        const tg = ctx.createLinearGradient(0, 0, -tl, 0);
        tg.addColorStop(0, hexA("#ff7b2e", 0.85)); tg.addColorStop(1, hexA("#ff2410", 0));
        ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.quadraticCurveTo(-tl * 0.6, 0, -tl, 0); ctx.quadraticCurveTo(-tl * 0.6, 0, 0, r * 0.5); ctx.closePath(); ctx.fill();
      }
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, "#fff2c0"); g.addColorStop(0.45, "#ff7b2e"); g.addColorStop(1, hexA("#ff2410", 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(r * 1.1, 0); ctx.quadraticCurveTo(0, r, -r * 1.2, 0); ctx.quadraticCurveTo(0, -r, r * 1.1, 0); ctx.closePath(); ctx.fill();
      if (os === "phoenix") {
        ctx.strokeStyle = "#ffd27a"; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(-r * 0.2, 0); ctx.quadraticCurveTo(-r * 1.6, -r * 1.1, -r * 2.2, -r * 0.1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r * 0.2, 0); ctx.quadraticCurveTo(-r * 1.6, r * 1.1, -r * 2.2, r * 0.1); ctx.stroke();
      }
      if (os === "clone") {   // 분신: 잔상 에코 고리 2겹 (복제 느낌)
        ctx.globalAlpha = 0.5; ctx.strokeStyle = "#ffca62"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(r * 0.35, 0, 3.4, 0, Math.PI * 2); ctx.fill();
    } else if (["blaze", "greatBurn", "plague", "ash"].includes(os)) {
      const flick = 1 + 0.25 * Math.sin(animClock * 12 + o.x * 0.2);
      const h = (os === "greatBurn" ? 44 : os === "plague" ? 34 : os === "ash" ? 36 : 22) * flick, w = os === "greatBurn" ? 26 : 19;
      ctx.translate(o.x, o.y);
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createLinearGradient(0, w, 0, -h);
      g.addColorStop(0, hexA("#ff2410", 0)); g.addColorStop(0.4, os === "plague" ? "#ffb000" : "#ff5a24"); g.addColorStop(1, "#fff3d0");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, -h); ctx.quadraticCurveTo(w, -h * 0.15, 0, w); ctx.quadraticCurveTo(-w, -h * 0.15, 0, -h); ctx.closePath(); ctx.fill();
      // 밝은 불꽃 코어
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.7);
      cg.addColorStop(0, hexA("#fff4d0", 0.9)); cg.addColorStop(1, hexA("#ff5a24", 0));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, w * 0.7, 0, Math.PI * 2); ctx.fill();
      if (os === "plague") { ctx.globalAlpha = 0.6; ctx.strokeStyle = "#ffd27a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
      if (os === "ash") { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#2b1117"; ctx.beginPath(); ctx.arc(0, 6, 7, 0, Math.PI * 2); ctx.fill(); }
    } else {                                       // 동그란 불씨 1차 (판정 14)
      const r = 14, g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
      g.addColorStop(0, "#fff2c0"); g.addColorStop(0.5, col); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// 좁은 전방 돌파 — 길쭉한 창/대시 자국 (폭열돌격자)
function drawThrust(ang, range, col) {
  const len = range * 1.1, w = range * 0.17;
  const ux = Math.cos(ang), uy = Math.sin(ang), ox = -Math.sin(ang), oy = Math.cos(ang);
  const tipx = ux * len, tipy = uy * len, bx = ux * range * 0.08, by = uy * range * 0.08;
  ctx.beginPath();
  ctx.moveTo(tipx, tipy);
  ctx.quadraticCurveTo(bx + ox * w, by + oy * w, bx, by);
  ctx.quadraticCurveTo(bx - ox * w, by - oy * w, tipx, tipy);
  ctx.closePath();
  const g = ctx.createLinearGradient(bx, by, tipx, tipy);
  g.addColorStop(0, hexA(col, 0.15)); g.addColorStop(0.6, col); g.addColorStop(1, "#fff3d0");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.strokeStyle = hexA(col, 0.9); ctx.stroke();
}

function drawStart() {
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  // 타이틀
  ctx.save();
  ctx.shadowColor = "rgba(255,120,50,0.55)"; ctx.shadowBlur = 26;
  ctx.letterSpacing = "6px";
  ctx.fillStyle = "#ffd98a"; ctx.font = 'bold 50px "Malgun Gothic"';
  ctx.fillText("마법사 키우기", W / 2, 90);
  ctx.restore();
  // 서브 라벨 + 장식선
  ctx.letterSpacing = "8px";
  ctx.fillStyle = UI.muted; ctx.font = '13px "Malgun Gothic"';
  ctx.fillText("CHARACTER  SELECT", W / 2, 122);
  ctx.letterSpacing = "0px";
  ctx.strokeStyle = "rgba(232,179,90,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 160, 137); ctx.lineTo(W / 2 - 80, 137); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + 80, 137); ctx.lineTo(W / 2 + 160, 137); ctx.stroke();
  ctx.fillStyle = "rgba(232,179,90,0.6)";
  ctx.save(); ctx.translate(W / 2, 137); ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -3, 6, 6); ctx.restore();

  const n = CHARACTERS.length, cw = 174, ch = 224, gap = 22;
  const total = n * cw + (n - 1) * gap;
  let x = (W - total) / 2;
  const yBase = 170;
  state._charRects = [];
  for (let i = 0; i < n; i++) {
    const c = CHARACTERS[i];
    const sel = i === selectedChar;
    const hover = mouse.x >= x && mouse.x <= x + cw && mouse.y >= yBase - 8 && mouse.y <= yBase + ch;
    const cy = yBase - (sel ? 8 : 0);
    const icx = x + cw / 2;

    // 카드 배경
    const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
    if (c.locked) { g.addColorStop(0, "#161320"); g.addColorStop(1, "#0f0c17"); }
    else if (sel) { g.addColorStop(0, "#2c2238"); g.addColorStop(1, "#1a1326"); }
    else { g.addColorStop(0, "#201a2c"); g.addColorStop(1, "#15101f"); }
    ctx.fillStyle = g;
    if (sel) { ctx.save(); ctx.shadowColor = c.color; ctx.shadowBlur = 28; }
    rr(x, cy, cw, ch, 16); ctx.fill();
    if (sel) ctx.restore();
    // 테두리
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.strokeStyle = sel ? c.color : (c.locked ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.12)");
    rr(x, cy, cw, ch, 16); ctx.stroke();

    // 아이콘 후광 + 마법사
    const icy = cy + 80;
    ctx.globalAlpha = c.locked ? 0.4 : 1;
    const halo = ctx.createRadialGradient(icx, icy, 4, icx, icy, 46);
    halo.addColorStop(0, hexA(c.color, 0.45)); halo.addColorStop(1, hexA(c.color, 0));
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(icx, icy, 46, 0, Math.PI * 2); ctx.fill();
    drawWizard(icx, icy, c.color, 1);
    ctx.globalAlpha = 1;

    // 이름 / 설명
    ctx.fillStyle = c.locked ? "#6a6478" : UI.text; ctx.font = 'bold 22px "Malgun Gothic"';
    ctx.fillText(c.name, icx, cy + 154);
    if (c.desc) { ctx.fillStyle = UI.muted; ctx.font = '13px "Malgun Gothic"'; ctx.fillText(c.desc, icx, cy + 178); }
    // 하단 상태
    ctx.font = 'bold 14px "Malgun Gothic"';
    if (c.locked) { ctx.fillStyle = "#6a6478"; ctx.fillText("준비 중", icx, cy + ch - 20); }
    else { ctx.fillStyle = sel ? UI.goldHi : UI.gold; ctx.fillText(sel ? "▶  플레이" : `${i + 1} 선택`, icx, cy + ch - 20); }

    state._charRects.push({ x, y: cy, w: cw, h: ch, i });
    x += cw + gap;
  }

  ctx.fillStyle = UI.muted; ctx.font = '14px "Malgun Gothic"';
  ctx.fillText("← →  선택      Enter / 클릭  시작", W / 2, yBase + ch + 40);
  ctx.fillStyle = UI.faint; ctx.font = '13px "Malgun Gothic"';
  ctx.fillText("방향키 이동 · 가까운 적 자동 공격 · B 자동플레이", W / 2, yBase + ch + 64);
  ctx.textAlign = "left";
}

function drawIntermission() {
  ctx.fillStyle = "rgba(8,5,12,0.35)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.save(); ctx.shadowColor = "rgba(240,180,90,0.5)"; ctx.shadowBlur = 16;
  ctx.letterSpacing = "3px";
  ctx.fillStyle = UI.goldHi; ctx.font = 'bold 38px "Malgun Gothic"';
  ctx.fillText(`WAVE ${state.wave} CLEAR`, W / 2, H / 2 - 4);
  ctx.restore(); ctx.letterSpacing = "0px";
  ctx.fillStyle = UI.muted; ctx.font = '16px "Malgun Gothic"';
  ctx.fillText("다음 웨이브 준비 중…", W / 2, H / 2 + 28);
  ctx.textAlign = "left";
}

function drawStat(cx, y, label, val) {
  ctx.textAlign = "center";
  ctx.fillStyle = UI.muted; ctx.font = '13px "Malgun Gothic"'; ctx.fillText(label, cx, y);
  ctx.fillStyle = UI.text; ctx.font = 'bold 30px "Malgun Gothic"'; ctx.fillText(val, cx, y + 32);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(6,4,10,0.78)"; ctx.fillRect(0, 0, W, H);
  drawEmbers(0.6);
  const pw = 440, ph = 248, px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = "rgba(20,14,28,0.92)"; rr(px, py, pw, ph, 18); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,90,90,0.4)"; rr(px, py, pw, ph, 18); ctx.stroke();
  ctx.textAlign = "center";
  ctx.save(); ctx.shadowColor = "rgba(231,76,60,0.6)"; ctx.shadowBlur = 20;
  ctx.letterSpacing = "4px";
  ctx.fillStyle = "#ff6b6b"; ctx.font = 'bold 44px "Malgun Gothic"';
  ctx.fillText("GAME OVER", W / 2, py + 76);
  ctx.restore(); ctx.letterSpacing = "0px";
  const sy = py + 130;
  drawStat(W / 2 - 124, sy, "웨이브", state.wave);
  drawStat(W / 2, sy, "처치", state.kills);
  drawStat(W / 2 + 124, sy, "레벨", state.player.level);
  ctx.fillStyle = UI.gold; ctx.font = 'bold 16px "Malgun Gothic"';
  ctx.fillText("R  또는  클릭 — 다시 시작", W / 2, py + ph - 26);
  ctx.textAlign = "left";
}

// 전직 직업 아이콘 (공격 스타일 미리보기)
function drawJobIcon(cx, cy, job) {
  const col = job.color;
  if (job.weapon === "slash") {
    ctx.save();
    ctx.translate(cx - 12, cy);
    crescentPath(0, 22, 11, 1.2);
    const g = ctx.createRadialGradient(0, 0, 8, 0, 0, 34);
    g.addColorStop(0, "rgba(255,120,40,0.9)"); g.addColorStop(0.6, hexA(col, 0.95)); g.addColorStop(1, "rgba(255,245,210,1)");
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.strokeStyle = "#fff7e4"; ctx.stroke();
    ctx.restore();
  } else if (job.weapon === "cannon") {
    const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, 21);
    grd.addColorStop(0, "#fff4d0"); grd.addColorStop(0.5, col); grd.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = hexA(col, 0.5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col;
    for (let k = 0; k < 3; k++) { const a = k * Math.PI * 2 / 3; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 22, cy + Math.sin(a) * 22, 5, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#fff3cf"; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawJobSelect() {
  ctx.fillStyle = "rgba(6,4,10,0.8)"; ctx.fillRect(0, 0, W, H);
  drawEmbers(0.5);
  ctx.textAlign = "center";
  ctx.save(); ctx.shadowColor = "rgba(255,120,50,0.55)"; ctx.shadowBlur = 22; ctx.letterSpacing = "6px";
  ctx.fillStyle = "#ffd98a"; ctx.font = 'bold 40px "Malgun Gothic"';
  ctx.fillText("전 직", W / 2, 92); ctx.restore(); ctx.letterSpacing = "0px";
  ctx.fillStyle = UI.muted; ctx.font = '16px "Malgun Gothic"';
  ctx.fillText("길을 선택하세요 (1 / 2 / 3 또는 클릭)", W / 2, 124);

  const n = state.jobChoices.length, cw = 200, ch = 240, gap = 26;
  const total = n * cw + (n - 1) * gap;
  let x = (W - total) / 2; const y = 176;
  state._jobRects = [];
  for (let i = 0; i < n; i++) {
    const job = JOBS[state.jobChoices[i]];
    const hover = mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + ch;
    const g = ctx.createLinearGradient(0, y, 0, y + ch);
    if (hover) { g.addColorStop(0, "#2c2238"); g.addColorStop(1, "#1a1326"); } else { g.addColorStop(0, "#201a2c"); g.addColorStop(1, "#15101f"); }
    ctx.fillStyle = g;
    if (hover) { ctx.save(); ctx.shadowColor = job.color; ctx.shadowBlur = 26; }
    rr(x, y, cw, ch, 16); ctx.fill();
    if (hover) ctx.restore();
    ctx.lineWidth = hover ? 2.5 : 1.5; ctx.strokeStyle = hover ? job.color : "rgba(255,255,255,0.12)"; rr(x, y, cw, ch, 16); ctx.stroke();

    const icx = x + cw / 2;
    ctx.fillStyle = job.color; ctx.font = 'bold 13px "Malgun Gothic"'; ctx.fillText(job.tag, icx, y + 34);
    const icy = y + 92;
    const halo = ctx.createRadialGradient(icx, icy, 4, icx, icy, 44);
    halo.addColorStop(0, hexA(job.color, 0.45)); halo.addColorStop(1, hexA(job.color, 0));
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(icx, icy, 44, 0, Math.PI * 2); ctx.fill();
    drawJobIcon(icx, icy, job);
    ctx.fillStyle = UI.text; ctx.font = 'bold 23px "Malgun Gothic"'; ctx.fillText(job.name, icx, y + 164);
    ctx.fillStyle = UI.muted; ctx.font = '13px "Malgun Gothic"'; ctx.fillText(job.desc, icx, y + 190);
    ctx.fillStyle = UI.gold; ctx.font = 'bold 14px "Malgun Gothic"'; ctx.fillText(`${i + 1} 선택`, icx, y + ch - 20);
    state._jobRects.push({ x, y, w: cw, h: ch, i });
    x += cw + gap;
  }
  ctx.textAlign = "left";
}

// ===== 클릭 처리 =====
function processClick() {
  if (!mouse.clicked) return;
  mouse.clicked = false;
  if (state.mode === "start") {
    if (state._charRects) {
      for (const r of state._charRects) {
        if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
          selectedChar = r.i;
          if (!CHARACTERS[r.i].locked) startGame();
          break;
        }
      }
    }
    return;
  }
  if (state.mode === "jobselect") {
    if (state._jobRects) {
      for (const r of state._jobRects) {
        if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) { applyJobChoice(r.i); break; }
      }
    }
    return;
  }
  if (state.mode === "gameover") { resetGame(); return; }
}

// ===== 메인 루프 =====
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;     // 스파이크 방지

  animClock += dt;
  updateEmbers(dt);
  if (botEnabled) {            // 봇: 자동 시작 / 전직 자동선택 / 사망 시 자동 재시작
    if (state.mode === "start") startGame();
    else if (state.mode === "jobselect") botPickJob();
    else if (state.mode === "gameover") resetGame();
  }
  processClick();
  window.state = state;          // 봇 훅 동기화
  if (state.mode === "playing" || state.mode === "intermission") update(dt, now);

  render();
  requestAnimationFrame(loop);
}

// 봇/시뮬용 노출
window.update = update;
window.loop = loop;
window.setBot = function (v) { botEnabled = !!v; if (!botEnabled) clearBotKeys(); return botEnabled; };
// 헤드리스 시뮬: 봇으로 한 판 끝까지 돌리고 웨이브별 기록 반환
window.runSim = function (maxWave, maxSteps, jobIdx, jobIdx2) {
  maxWave = maxWave || 40; maxSteps = maxSteps || 300000;
  botJobChoice = jobIdx || 0;          // 1차: 0=검사 1=화포 2=불씨
  botJobChoice2 = jobIdx2 || 0;        // 2차: 갈래 내 0/1/2
  resetGame(); selectedChar = 0; startGame(); botEnabled = true;
  const dt = 1 / 60; let now = performance.now(), steps = 0, lastWave = state.wave;
  const log = [{ wave: 1, kills: 0, hp: Math.round(state.player.hp), lvl: 1 }];
  while (steps < maxSteps && state.mode !== "gameover" && state.wave <= maxWave) {
    if (state.mode === "jobselect") { botPickJob(); continue; }
    now += dt * 1000; update(dt, now);
    if (state.wave !== lastWave) {
      log.push({ wave: state.wave, kills: state.kills, hp: Math.round(state.player.hp), lvl: state.player.level });
      lastWave = state.wave;
    }
    steps++;
  }
  botEnabled = false; clearBotKeys();
  return { finalWave: state.wave, mode: state.mode, job: state.player.job, kills: state.kills, level: state.player.level, hp: Math.round(state.player.hp), seconds: Math.round(steps * dt), log };
};

if (getPreviewJob() && JOBS[getPreviewJob()]) startGame();
requestAnimationFrame(loop);
</script>
